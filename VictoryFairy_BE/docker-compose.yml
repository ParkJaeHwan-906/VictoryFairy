services:
  mysql:
    image: mysql:8.0
    container_name: victoryfairy-mysql
    env_file:
      - .env
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: victoryfairy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  user:
    # dev/test 프로파일은 LogEmailSender(mock)를 쓰므로 MAIL_* 환경변수 주입이 불필요함.
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: user
    container_name: victoryfairy-user
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # 프로필 이미지(S3). 값은 application.yaml 기본값과 같지만 명시해 둔다 — k8s 매니페스트는
      # 이미 주입하고 있어서, 여기서만 비어 있으면 "로컬에선 되는데 파드에선 다르다"의 반대
      # 상황(로컬만 암묵 기본값)이 생긴다.
      # ⚠ 자격증명은 넣지 않는다. 로컬 컨테이너에는 ~/.aws 도 IRSA 도 없어 업로드는 실패한다(정상).
      USER_PROFILE_IMAGE_BUCKET: ${USER_PROFILE_IMAGE_BUCKET:-victoryfairy-asset}
      USER_PROFILE_IMAGE_REGION: ${USER_PROFILE_IMAGE_REGION:-ap-northeast-2}
      USER_PROFILE_IMAGE_BASE_URL: ${USER_PROFILE_IMAGE_BASE_URL:-https://victoryfairy.com}
      # temp 정리 스케줄러는 로컬에서 꺼 둔다 — 켜면 새벽에 실제 S3 객체를 지우러 간다.
      USER_CLEANUP_TEMP_PROFILE_IMAGE_ENABLED: ${USER_CLEANUP_TEMP_PROFILE_IMAGE_ENABLED:-false}
    ports:
      - "8080:8080"

  quiz:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: quiz
    container_name: victoryfairy-quiz
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      # prod 프로파일의 실시간 fan-out(RedisPubSubPublisher + 리스너 컨테이너)이 기동 시점에
      # Redis 구독 연결을 맺으므로 redis 가 먼저 떠 있어야 한다.
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8081:8081"

volumes:
  mysql-data:
