# EC2 운영용 compose: 이미지를 직접 빌드하지 않고 GHCR에서 받은 이미지를 실행한다.
# (빌드는 GitHub Actions에서 수행)
#
# DB는 AWS RDS 사용 → mysql 컨테이너 없이 .env 의 RDS 주소(DB_HOST)로 접속.
#
# 메모리 전략 (스왑 의존 X):
#   - mem_limit 로 컨테이너별 상한 → 한 앱이 폭주해도 그 컨테이너만 OOM-kill, 호스트는 생존(SSH 유지)
#   - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage 로 힙을 컨테이너 상한에 맞춰 자동 산정
#   - 예산(t3.small 2GB, 실제 스펙은 .claude/modules/infra.md 확인): user 500m + quiz 500m + redis 64m + nginx 128m = 1192m + OS/도커 여유
#     (create 는 주석 처리 상태라 예산 미포함. 되살릴 경우 +500m 로 재계산 필요)
#
# 사용 예) IMAGE_PREFIX=ghcr.io/parkjaehwan-906  IMAGE_TAG=latest  docker compose -f docker-compose.prod.yml up -d
services:
  # 리버스 프록시: 외부 80포트 → 경로별로 각 앱 서비스로 분배 (도커 네트워크 내부에서 서비스명으로 접근)
  nginx:
    image: nginx:1.27-alpine
    container_name: victoryfairy-nginx
    restart: unless-stopped
    mem_limit: 128m
    # 앱이 '실제로 응답할 때까지' 기다렸다 뜬다. 종전엔 기동 순서만 보장해(depends_on 단문법)
    # 앱이 부팅 중이어도 nginx 가 떠서 502 를 뿌렸다.
    # ⚠ 배포 동작 변화: 앱이 끝내 healthy 가 안 되면 `docker compose up -d` 가 실패한다.
    #   deploy.yml 이 set -e 라 배포 스텝이 거기서 멈춘다 — 조용히 깨진 채 배포되던 것보다 낫다.
    depends_on:
      user:
        condition: service_healthy
      quiz:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # 이메일 인증 코드 저장용. 데이터는 휘발성(TTL 만료)이라 영속 볼륨 없이 컨테이너 재기동 시 초기화되어도 무방.
  # 외부 포트 미개방 — user 컨테이너가 도커 내부 네트워크에서 서비스명(redis)으로만 접근.
  redis:
    image: redis:7.2-alpine
    container_name: victoryfairy-redis
    restart: unless-stopped
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  user:
    image: ${IMAGE_PREFIX}/victoryfairy-user:${IMAGE_TAG:-latest}
    container_name: victoryfairy-user
    restart: unless-stopped
    mem_limit: 500m
    depends_on:
      redis:
        condition: service_healthy
    # ⚠ 경로에 context-path(/api/member)가 붙는다. `/health`·`/healthz` 로 걸면 404 라 영구 unhealthy 가 된다.
    # ⚠ /actuator/health 전체가 아니라 readiness 그룹이다. 전체는 db·redis 인디케이터를 합산해 DOWN 을 내므로
    #    DB 가 잠깐 흔들리면 앱 컨테이너까지 unhealthy 로 뒤집히고 nginx 가 502 를 낸다.
    # 런타임 이미지(eclipse-temurin:21-jre, Ubuntu)에 curl 이 포함돼 있어 추가 설치가 필요 없다.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:8080/api/member/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s # t3.small 에서 Spring 부팅이 느리다. 이 구간의 실패는 재시도로 세지 않는다.
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: ${DB_HOST}          # RDS 엔드포인트 (.env 에서 주입)
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # 이메일 인증 실발송(SmtpEmailSender, prod 프로파일 전용) - Mailjet SMTP 릴레이.
      # HOST/PORT는 Mailjet 고정값이라 하드코딩. USERNAME=API Key, PASSWORD=Secret Key(시크릿이라 .env 에서 주입).
      MAIL_HOST: in-v3.mailjet.com
      MAIL_PORT: 587
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # 발신 도메인 victoryfairy.com은 Mailjet에서 SPF/DKIM 인증 완료 상태여야 네이버·다음 도달률이 확보된다.
      MAIL_FROM: ${MAIL_FROM:-no-reply@victoryfairy.com}
    # nginx(호스트)에서만 접근 가능하도록 localhost로 한정. 외부 직접 접근 차단.
    ports:
      - "127.0.0.1:8080:8080"

  quiz:
    image: ${IMAGE_PREFIX}/victoryfairy-quiz:${IMAGE_TAG:-latest}
    container_name: victoryfairy-quiz
    restart: unless-stopped
    mem_limit: 500m
    # user 와 동일한 주의사항 — context-path 는 /api/game, readiness 그룹을 쓴다.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:8081/api/game/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:8081:8081"
