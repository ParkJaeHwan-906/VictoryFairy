spring:
  application:
    name: user
  main:
    web-application-type: servlet
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  web:
    error:
      include-message: always
  # 이메일 인증 상태 저장소. 로컬 기본 localhost:6379, 배포 시 환경변수로 override.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # 프로필 이미지 업로드(멀티파트) 한도.
  #
  # ⚠ Boot 기본값은 max-file-size 1MB 라, 이 블록이 없으면 5MiB 이미지가 컨테이너 단에서 413 이 되어
  #   "5MiB 정확히는 통과" 경계가 깨진다.
  # ⚠ 반대로 여기를 딱 5MiB 로 맞추지도 말 것 — 멀티파트 경계·헤더 오버헤드 때문에 5MiB 정확한
  #   파일까지 걸린다. 여기는 명백한 초과만 거르는 1차 방어로 넉넉히 두고, 정확한 경계 판정은
  #   실제 바이트 길이를 재는 애플리케이션(ProfileImagePolicy.MAX_SIZE_BYTES)이 한다.
  #   두 경로 모두 같은 ErrorCode(PROFILE_IMAGE_TOO_LARGE)로 나가 응답은 구분되지 않는다.
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    # 이 앱의 모든 경로에 붙는 외부 접두사. 컨트롤러는 자기 자원 이름만 갖는다
    # (@RequestMapping("/auth") → 외부 /api/auth/**).
    #
    # ⚠ 서블릿 컨테이너가 필터 체인 '이전에' 이 접두사를 떼므로:
    #   - SecurityConfig 의 requestMatchers 는 접두사를 뺀 경로(/auth/**)를 쓴다.
    #   - MockMvc 는 context-path 를 적용하지 않으므로 슬라이스 테스트도 /auth/** 로 요청한다.
    # ⚠ ALB 는 forward 시 경로 rewrite 를 못 하므로 k8s/22-ingress.yaml 의 path 와
    #   이 값이 문자 그대로 일치해야 한다.
    context-path: /api

# 만료 데이터 정리 스케줄러(탈퇴 30일 경과 계정 하드 삭제 + 만료 refresh 토큰 삭제).
#
# ⚠ 기본값이 꺼짐인 것은 취향이 아니라 안전장치다. 로컬 bootRun 은 .env 의 원격 IP 를 따라
#   '원격 개발 DB' 를 직접 본다 — 켜 둔 채 새벽 3시를 넘기면 원격 DB 의 계정이 실제로 지워지고,
#   하드 삭제라 되돌릴 방법이 백업뿐이다. prod 프로파일만 기본값을 켬으로 덮는다
#   (application-prod.yaml). dev 에서 검증이 필요하면 이 값을 명시적으로 켤 것.
# ⚠ enabled 는 실행 여부만이 아니라 '스케줄링 활성화(@EnableScheduling)' 자체의 조건이다
#   (CleanupSchedulingConfig).
# cron 은 zone = Asia/Seoul 기준으로 해석된다(스케줄러 애노테이션에 고정) — 파드 TZ 와 무관하다.
user:
  cleanup:
    expired-data:
      enabled: ${USER_CLEANUP_EXPIRED_DATA_ENABLED:false}
      cron: "${USER_CLEANUP_EXPIRED_DATA_CRON:0 0 3 * * *}"
    # 임시 프로필 이미지(temp/) 정리 스케줄러. 위와 스위치가 완전히 별개다 — 하나만 켜도 켠 쪽은
    # 반드시 돈다(CleanupSchedulingConfig 가 두 스위치의 OR 로 스케줄링을 켠다).
    # 기본값이 꺼짐인 이유는 위와 같다: 로컬·dev 가 원격 자원(여기서는 버킷)을 직접 본다.
    # 만료 데이터 정리(03:00)와 한 시간 띄운 04:00 이다 — 같은 시각이면 락·부하가 겹친다.
    temp-profile-image:
      enabled: ${USER_CLEANUP_TEMP_PROFILE_IMAGE_ENABLED:false}
      cron: "${USER_CLEANUP_TEMP_PROFILE_IMAGE_CRON:0 0 4 * * *}"

  # 프로필 이미지 저장소(S3).
  # ⚠ 자격증명은 여기에 없다 — 로컬은 ~/.aws, prod 파드는 IRSA 가 넣는다(ProfileImageStorageConfig).
  # ⚠ 읽기(CloudFront BaseURL https://victoryfairy.com)는 서버가 관여하지 않는다. 서버가 돌려주는
  #   값은 언제나 BaseURL 을 뺀 EP 이고, 조립은 클라이언트 몫이다.
  profile-image:
    bucket: ${USER_PROFILE_IMAGE_BUCKET:victoryfairy-asset}
    region: ${USER_PROFILE_IMAGE_REGION:ap-northeast-2}

# 소셜 로그인(OAuth) 3사.
#
# ⚠ 시크릿은 이 파일에 적지 않는다 — 값의 출처는 언제나 환경변수(.env / k8s Secret)다.
# ⚠ client-id 가 비어 있는 provider 는 지원 목록에서 빠진다(그 provider 요청은 400
#   UNSUPPORTED_OAUTH_PROVIDER). 기동은 정상적으로 되므로 "왜 카카오만 400인가"의 답은 거의 항상
#   이 값의 누락이다.
# ⚠ redirect-uris 는 콤마로 구분한 목록이고, 대조는 접두 일치가 아니라 문자 그대로 완전 일치다.
#   웹 주소와 앱 커스텀 스킴을 모두 넣어야 하며, provider 콘솔의 화이트리스트와 같은 값이어야 한다
#   (한쪽만 늘리면 provider 가 인가코드를 안 주거나 우리가 400 을 준다).
oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uris: ${KAKAO_REDIRECT_URIS:}
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    redirect-uris: ${NAVER_REDIRECT_URIS:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uris: ${GOOGLE_REDIRECT_URIS:}

# 인증번호 메일 발신자 주소. 실제 SMTP 발송은 prod 프로파일에서만 일어난다(dev/test는 mock 로그).
app:
  mail:
    from: ${MAIL_FROM:no-reply@victoryfairy.com}

# ALB 타깃 그룹 헬스체크용. health 만 노출한다(그 외 액추에이터 엔드포인트는 닫힘).
#
# ⚠ ALB 는 /actuator/health 가 아니라 '/actuator/health/readiness' 를 본다
#   (k8s/22-ingress.yaml 의 healthcheck-path = /api/actuator/health/readiness).
#   전체 health 는 db·redis·mail 인디케이터를 모두 합산해 DOWN 을 내므로, MySQL EC2 가 잠깐
#   흔들리면 살아있는 파드까지 타깃에서 빠져 전면 503 이 된다. readiness 그룹은 기본적으로
#   readinessState 만 보므로 그런 연쇄를 만들지 않는다.
# ⚠ context-path(/api) 아래로 들어가므로 외부 경로에는 접두사가 붙는다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true # liveness/readiness 그룹 활성화

jwt:
  # 기본값 절대 사용 X -> .env의 JWT_SECRET으로 덮어쓸 것 (32바이트 이상)
  secret: ${JWT_SECRET:local-dev-secret-please-change-this-to-a-32byte-plus-random-value}
  access-token-validity: 10800000      # 3시간 (ms)
  refresh-token-validity: 1209600000  # 14일 (ms)
