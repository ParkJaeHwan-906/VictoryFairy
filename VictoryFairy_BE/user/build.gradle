plugins {
    id 'org.springframework.boot'
}

description = 'user'

dependencies {
    implementation project(':common')
    implementation project(':domain')
    implementation project(':web-support')   // JWT 발급/검증·예외 핸들러·401 엔트리포인트 공유 인프라

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'     // ALB 타깃 헬스체크(/actuator/health/readiness)

    // 프로필 이미지 저장 — S3 victoryfairy-asset 버킷에 쓰기/복사/삭제/목록. 자격증명은 코드에 없다:
    // 로컬은 ~/.aws(aws configure), prod 파드는 IRSA 가 DefaultCredentialsProvider 로 주입된다
    // (quiz 의 퀴즈 적재가 같은 방식·같은 BOM 버전을 쓴다).
    implementation platform('software.amazon.awssdk:bom:2.46.7')
    implementation 'software.amazon.awssdk:s3'
    // IRSA 필수 — 웹 아이덴티티 토큰 교환은 sts 모듈이 클래스패스에 있어야 기본 체인이 수행한다.
    // 없으면 로컬(~/.aws)에선 멀쩡하다가 IRSA 파드에서만 자격증명 로드가 실패한다.
    runtimeOnly 'software.amazon.awssdk:sts'

    runtimeOnly 'me.paulschwarz:spring-dotenv:4.0.0'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

// 배포 선행 SQL(infra/sql)을 그대로 클래스패스에 실어 dev 기동 시 자동 시드에 쓴다
// (application-dev.yaml 의 spring.sql.init.data-locations 참고).
// 복사해 쓰는 이유: 시드 SQL 의 단일 출처는 infra/sql 이고, 운영은 같은 파일을 사람이 직접 적용한다.
// 여기에 사본을 따로 두면 두 벌이 갈라진다.
processResources {
    from("${rootDir}/infra/sql") {
        into 'sql'
        include '*.sql'
    }
}
