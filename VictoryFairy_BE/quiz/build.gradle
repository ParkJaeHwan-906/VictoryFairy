plugins {
    id 'org.springframework.boot'
}

description = 'quiz'

dependencies {
    implementation project(':common')
    implementation project(':domain')
    implementation project(':web-support')   // JWT 검증 부품(JwtVerificationConfig)·401 엔트리포인트·예외 핸들러 재사용

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'   // 채팅 content 검증(@Valid/@NotBlank/@Size)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'   // 실시간 fan-out pub/sub(prod 다중 파드)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'     // ALB 타깃 헬스체크(/actuator/health/readiness)

    // 퀴즈 적재 — S3 quiz-candidates/{date}/ 읽기 전용. 자격증명은 코드에 없다:
    // 로컬은 ~/.aws(aws configure), prod 파드는 IRSA 가 DefaultCredentialsProvider 로 주입된다.
    implementation platform('software.amazon.awssdk:bom:2.46.7')
    implementation 'software.amazon.awssdk:s3'
    // IRSA 필수 — 웹 아이덴티티 토큰 교환은 sts 모듈이 클래스패스에 있어야 기본 체인이 수행한다.
    // 없으면 로컬(~/.aws)에선 멀쩡하다가 IRSA 파드에서만 자격증명 로드가 실패한다.
    runtimeOnly 'software.amazon.awssdk:sts'
    runtimeOnly 'me.paulschwarz:spring-dotenv:4.0.0'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}
