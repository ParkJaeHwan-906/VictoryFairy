spring:
  application:
    name: quiz
  main:
    web-application-type: servlet
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    # 두 용도가 같은 연결을 쓴다. 운영 값은 k8s configmap app-config 가 주입한다.
    #   1) 실시간 fan-out pub/sub — prod 전용(RedisPubSubPublisher/RealtimeRedisConfig).
    #      prod 이외 프로파일은 연결을 맺는 빈이 아예 등록되지 않는다(=InMemoryPublisher).
    #   2) 퀴즈 보기별 투표 집계(RedisQuizVoteTally) — 프로파일 무관, dev 도 실제 Redis 에 쓴다.
    #      최종 검증이 dev 프로파일 docker 기동이라 prod 전용이면 거기서 통째로 no-op 이 된다.
    #      다만 연결 실패를 삼키므로 Redis 없이 맨몸 기동해도 기동·요청은 깨지지 않는다.
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    # REST/SSE 전용 앱이라 OSIV 불필요. 모든 LAZY 접근(Chat.userAccount.nickname,
    # Chatroom.team.name)은 @Transactional 서비스 메서드 안에서 끝나고 컨트롤러 경계는
    # DTO 레코드만 넘어간다. OSIV=true면 SSE 롱커넥션이 응답이 끝날 때까지 JPA 커넥션을
    # 잡아 mem_limit 500m / Hikari 기본 풀에서 고갈 위험 → 전 프로파일 false로 고정.
    # LAZY 접근을 트랜잭션 밖으로 옮기지 않는 한 되돌리지 말 것. (미측정: 정합성 기반 판단)
    open-in-view: false
  mvc:
    async:
      # SSE는 SseEmitterRegistry.EMITTER_TIMEOUT_MS(30분) + 15초 하트비트로 수명을 관리한다.
      # SseEmitter의 명시 타임아웃은 DeferredResult로 전파돼 이 전역값을 개별 오버라이드하므로
      # 현재 SSE는 이 설정과 무관하게 30분까지 유지된다(동작 변화 없음). 이 값은 타임아웃 없이
      # new SseEmitter()로 만들어질 미래의 emitter나 여타 async 요청이 톰캣 기본 30초에 조기
      # 종료되는 것을 막는 안전망이다. SSE emitter 타임아웃보다 낮추지 말 것.
      request-timeout: 30m

server:
  port: 8081
  servlet:
    # 이 앱의 모든 경로에 붙는 외부 접두사. 컨트롤러는 자기 자원 이름만 갖는다
    # (@RequestMapping("/chat") → 외부 /rt/chat/**).
    #
    # ⚠ 서블릿 컨테이너가 필터 체인 '이전에' 이 접두사를 떼므로:
    #   - SecurityConfig 의 requestMatchers 는 접두사를 뺀 경로를 쓴다.
    #   - MockMvc 는 context-path 를 적용하지 않으므로 슬라이스 테스트도 /chat/** 로 요청한다.
    # ⚠ ALB 는 forward 시 경로 rewrite 를 못 하므로 k8s/22-ingress.yaml 의 path 와
    #   이 값이 문자 그대로 일치해야 한다.
    context-path: /rt

# ALB 타깃 그룹 헬스체크용. health 만 노출한다(그 외 액추에이터 엔드포인트는 닫힘).
#
# ⚠ ALB 는 /actuator/health 가 아니라 '/actuator/health/readiness' 를 본다
#   (k8s/22-ingress.yaml 의 healthcheck-path = /rt/actuator/health/readiness).
#   전체 health 는 db 인디케이터까지 합산해 DOWN 을 내므로, MySQL EC2 가 잠깐 흔들리면
#   살아있는 파드까지 타깃에서 빠져 전면 503 이 된다. readiness 그룹은 기본적으로
#   readinessState 만 보므로 그런 연쇄를 만들지 않는다.
# ⚠ context-path(/rt) 아래로 들어가므로 외부 경로에는 접두사가 붙는다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true # liveness/readiness 그룹 활성화

jwt:
  # 토큰 검증만 수행. user와 반드시 동일한 secret이어야 검증됨 (.env의 JWT_SECRET 공유)
  secret: ${JWT_SECRET:local-dev-secret-please-change-this-to-a-32byte-plus-random-value}

# S3 quiz-candidates → RDB 적재 (QuizIngestScheduler·QuizCandidateReader)
quiz:
  ingest:
    # 생성 루틴이 쓰는 버킷과 같은 곳(읽기 전용). crawl-dev 가 크롤 파이프라인의 '운영' 버킷이다
    # — crawl-local 은 테스트용(퀴즈 실데이터 아님). 이름의 dev 에 속지 말 것.
    bucket: ${QUIZ_S3_BUCKET:victoryfairy-crawl-dev}
    region: ${QUIZ_S3_REGION:ap-northeast-2}
    # 매일 10:30 KST — 생성 루틴(08:50 시작·상한 60분)이 끝난 뒤 30분 여유. 기동 시 1회 적재
    # (on-startup, 기본 on)가 이 시각의 사각(그 이후 재시작한 파드)을 메운다. 둘 다 멱등.
    cron: ${QUIZ_INGEST_CRON:0 30 10 * * *}
    on-startup: ${QUIZ_INGEST_ON_STARTUP:true}
  serve:
    # 전원 동일 데일리 세트 크기 — 편성 잡(QuizPublishService)이 이 수까지 미편성 풀에서 채운다.
    # 경기 문항(적재가 바로 날짜를 찍음)이 이미 이 수를 넘는 날은 그대로 두고 보충하지 않는다.
    daily-count: ${QUIZ_SERVE_DAILY_COUNT:10}
    # GET /today 한 번에 내려줄 최대 문제 수(QuizService). 위 daily-count 와 별개 축이다 —
    # 저건 '그날 세트를 몇 개로 편성하느냐'(편성), 이건 '한 번에 몇 개까지 보여주느냐'(서빙)다.
    # 기본값끼리는 편성 10 < 상한 20 이라 상한이 발동하지 않는다(세트가 20 을 넘는 날에만 의미).
    # ⚠ 여기서 잘려 나간 문제는 미답 행이 안 생겨 제출도 403 이다 — 낮출 때 그 영향을 함께 볼 것.
    # ⚠ 이 값이 곧 "한 번에 시계에 들어가는 문제 수"다 — 실린 문제는 각자 8분 시한을 갖고 시작하며,
    #   연장 수단이 없다(문제당 10~20초 × 20문제 ≒ 7분이 그 8분의 근거).
    max-today-count: ${QUIZ_SERVE_MAX_TODAY_COUNT:20}
  vote:
    # 보기별 투표 집계 키(quiz:votes:{quizId})의 수명. 키가 처음 만들어질 때만 걸고 연장하지 않는다.
    # 덮어야 하는 구간은 "그날 첫 서빙(가장 이른 낮경기가 IN_PROGRESS 가 된 직후) ~ 그날 마지막 표
    # (야간경기 종료 + 8분 제출 시한)"이다. 세트는 quiz_date 단위로 전원 동일해서 낮경기 관중이 키를
    # 만들고 야간경기 관중이 마지막 표를 넣는다 — 최악(더블헤더·자정 넘긴 연장)이 약 11시간 30분이라
    # 12시간은 여유가 30분~2시간뿐이다.
    # ⚠ 짧으면 단순 유실보다 나쁘다: 투표 중에 만료되면 늦게 들어온 제출이 키를 0 부터 다시 만들어,
    #   후속 조회가 반토막 난 분포를 정상인 것처럼 노출한다(응답만 봐선 잘린 값인지 알 수 없다).
    #   위 마진은 KBO 편성에 의존하고 편성은 시즌마다 바뀌므로, 재빌드 없이 이 값만 올릴 것.
    ttl: ${QUIZ_VOTE_TTL:12h}
