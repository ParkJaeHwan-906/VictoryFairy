spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 스키마도 기본 데이터도 이 앱은 만들지 않는다. 테이블은 user 앱의 ddl-auto=update 가,
  # 시드(구단·SYSTEM 계정·채팅방)는 user 앱의 spring.sql.init 이 넣는다 — 채팅 테이블까지 그렇다
  # (UserApplication 이 @EntityScan("com.skhynix") 로 domain 엔티티를 전부 스캔하므로).
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    # open-in-view: false 는 base application.yaml 에서 전 프로파일 공통으로 고정(단일 출처).
