spring:
  datasource:
    # ⚠ serverTimezone(=connectionTimeZone) 을 다시 넣지 말 것. MySQL 서버는 실제로 UTC 로 도는데
    #   Asia/Seoul 로 선언하면 preserveInstants 기본값(true) 탓에 드라이버가 DATETIME 을 KST 로
    #   해석했다가 JVM 기본 TZ 로 변환한다 — 파드는 TZ 미설정(UTC)이라 game_date 18:30 이 09:30 으로
    #   9시간 밀려 나갔다(로컬 JVM 은 KST 라 변환이 no-op 이 되어 재현되지 않는다).
    #   preserveInstants=false 는 벽시계 값을 변환 없이 주고받게 해 로컬과 파드를 같게 만든다.
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?preserveInstants=false&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 스키마도 기본 데이터도 이 앱은 만들지 않는다. 테이블은 user 앱의 ddl-auto=update 가,
  # 시드(구단·SYSTEM 계정·채팅방)는 user 앱의 spring.sql.init 이 넣는다 — 채팅 테이블까지 그렇다
  # (UserApplication 이 @EntityScan("com.skhynix") 로 domain 엔티티를 전부 스캔하므로).
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    # open-in-view: false 는 base application.yaml 에서 전 프로파일 공통으로 고정(단일 출처).
