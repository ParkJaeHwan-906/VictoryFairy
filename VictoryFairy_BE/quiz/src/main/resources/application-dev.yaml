spring:
  datasource:
    # ⚠ serverTimezone(=connectionTimeZone) 을 다시 넣지 말 것. preserveInstants 기본값(true) 이면
    #   드라이버가 DATETIME 을 선언한 존으로 해석했다가 JVM 기본 존으로 변환한다. 과거엔 이 옵션을
    #   Asia/Seoul 로 선언했는데 MySQL 서버는 UTC, 파드도 TZ 미설정(UTC)이라 game_date 18:30 이
    #   09:30 으로 9시간 밀려 나갔다(로컬 JVM 은 KST 라 변환이 no-op 이 되어 재현되지 않았다 — dev
    #   프로파일로 로컬 bootRun 이 원격 devdb 를 칠 때도 같은 이유로 재현되지 않는다).
    #   preserveInstants=false 는 이 변환 자체를 꺼서 벽시계 값을 그대로 주고받는다 — 로컬·파드·
    #   MySQL 서버의 TZ 설정이 서로 어긋나도(설정 누락 등) 값이 밀리지 않도록 그 의존 자체를 없앤다.
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?preserveInstants=false&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 로컬은 엔티티 기준으로 누락 테이블/컬럼을 자동 생성(additive)한다. 빈 볼륨으로 시작해도
      # 스키마 자체는 만들어진다(데이터는 아래 참고).
      # ⚠ update 는 추가만 반영한다 — 컬럼 삭제·타입 변경·인덱스 제거는 그대로 남는다. 엔티티에서
      #   무언가를 없앴는데 로컬만 이상하면 스키마가 낡은 것이니 DB 를 지우고 다시 띄울 것.
      #   (종전 validate 는 이런 드리프트를 즉시 잡아줬지만, 대신 사람이 손으로 DDL 을 맞춰야 했다.)
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 로컬 시드(구단 10개·SYSTEM 계정·구단별 채팅방)는 이 앱이 넣지 않는다 — user-app 이 dev 기동 시
# 넣는다(user/src/main/resources/application-dev.yaml 의 spring.sql.init). 테이블을 만드는 앱과
# 기본 데이터를 넣는 앱을 하나로 모으려고 옮겼다(prod 에서 DDL 을 내는 앱도 user 뿐이다).
# ⚠ 그래서 빈 DB 에 quiz 만 띄우면 테이블은 있어도 채팅방이 0행이다. 채팅방 목록이 비어 있으면
#   설정을 의심하기 전에 user-app 을 한 번 띄울 것.

# dev 의 fan-out 은 Redis 가 아니라 InMemoryPublisher 다(투표 집계 RedisQuizVoteTally 는 dev 에서도
# 실제 Redis 를 쓰지만, 실패를 삼켜 no-op 으로 degrade 하므로 Redis 없이도 기동·요청이 멀쩡하다).
# 그런데 spring-boot-starter-data-redis 가 클래스패스에 있다는 이유만으로 액추에이터가 redis
# 인디케이터를 켜서, 로컬에 Redis 가 없으면 /actuator/health 가 DOWN 으로 보인다 → 오해를 막기 위해
# dev 에서만 끈다(집계 기능과는 무관한 표시 문제다 — 이 결정은 건드리지 않는다).
# (readiness 그룹은 원래 이 인디케이터를 보지 않으므로 ALB 헬스체크와는 무관하다.)
management:
  health:
    redis:
      enabled: false
