apiVersion: v1
kind: Pod
metadata:
  name: chatbot
  namespace: victoryfairy
  labels:
    app: demo1110
spec:
  restartPolicy: OnFailure   # 죽으면 다시 뜬다 — 각 스크립트는 재시작해도 이어서 돈다
  containers:
    - name: bot
      image: python:3.12-slim
      envFrom:
        - secretRef:
            name: app-secret   # JWT_SECRET·DB_USERNAME·DB_PASSWORD
      env:
        - name: END_AT
          value: "2026-11-15 23:59"   # KST
        - name: ACTIVE_HOURS
          value: "8-24"   # 이 시간대(KST)에만 접속
        - name: STAY_SEC
          value: "25,150"   # 한 번 들어와 머무는 시간
        - name: REST_SEC
          value: "15,110"   # 나갔다가 다시 들어오기까지
        - name: MSG_INTERVAL
          value: "3"   # 방 전체 평균 채팅 간격(초) — 득점·역전 같은 이벤트 반응은 이것과 별도로 몰려 나온다
        - name: LIKES_PER_SEC
          value: "5"   # 응원 연타 속도 상한(서버 제한 10)
        - name: LIKE_BURST_SEC
          value: "2,8"
        - name: LIKE_REST_SEC
          value: "3,20"
        - name: EXCLUDE_GAME_IDS
          value: ""
        - name: DB_HOST
          value: mysql
        - name: PYTHONUNBUFFERED
          value: "1"
      command: ["sh", "-c", "pip install -q pymysql && python /bot/chatbot.py"]
      volumeMounts:
        - name: script
          mountPath: /bot
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { cpu: "1", memory: 512Mi }
  volumes:
    - name: script
      configMap:
        name: demo1110-scripts
