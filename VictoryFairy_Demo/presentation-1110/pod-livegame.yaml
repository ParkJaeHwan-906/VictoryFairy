apiVersion: v1
kind: Pod
metadata:
  name: livegame
  namespace: victoryfairy
  labels:
    app: demo1110
spec:
  restartPolicy: OnFailure   # 죽으면 다시 뜬다 — 각 스크립트는 재시작해도 이어서 돈다
  containers:
    - name: bot
      image: python:3.12-slim
      envFrom:
        - secretRef:
            name: app-secret   # JWT_SECRET·DB_USERNAME·DB_PASSWORD
      env:
        - name: END_AT
          value: "2026-11-15 23:59"   # KST
        - name: DEMO_PREFIX
          value: "DEMO"
        - name: TICK_SEC
          value: "12,30"   # 경기마다 승률 갱신 간격(초)
        - name: FINISH_LEAD_MIN
          value: "6"   # 9회 종료 → FINISHED 사이 여유(분)
        - name: REDIS_HOST
          value: "redis"
        - name: DB_HOST
          value: mysql
        - name: PYTHONUNBUFFERED
          value: "1"
      command: ["sh", "-c", "pip install -q pymysql redis && python /bot/livegame.py"]
      volumeMounts:
        - name: script
          mountPath: /bot
      resources:
        requests: { cpu: 10m, memory: 64Mi }
        limits: { cpu: 200m, memory: 128Mi }
  volumes:
    - name: script
      configMap:
        name: demo1110-scripts
