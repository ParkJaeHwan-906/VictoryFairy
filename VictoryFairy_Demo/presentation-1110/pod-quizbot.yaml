apiVersion: v1
kind: Pod
metadata:
  name: quizbot
  namespace: victoryfairy
  labels:
    app: demo1110
spec:
  restartPolicy: OnFailure   # 죽으면 다시 뜬다 — 각 스크립트는 재시작해도 이어서 돈다
  containers:
    - name: bot
      image: python:3.12-slim
      envFrom:
        - secretRef:
            name: app-secret   # JWT_SECRET·DB_USERNAME·DB_PASSWORD
      env:
        - name: END_AT
          value: "2026-11-15 23:59"   # KST
        - name: ACTIVE_HOURS
          value: "8-24"
        - name: SOLVERS
          value: "40"   # 동시에 방에 들어와 있는 슬롯 수. 접속 인원 = 고유 계정이라 페르소나 수(44)가 상한
        - name: BROWSE_SEC
          value: "90,420"   # 풀지 않고 머무는 시간
        - name: REST_SEC
          value: "3,20"
        - name: CORRECT_P
          value: "0.68"   # 정답률
        - name: LIKE_P
          value: "0.12"   # 방문 한 번에 좋아요 확률
        - name: SOLVE_PACE
          value: "1.0"   # 작을수록 실제 풀이가 잦다
        - name: RELEASE_HOUR
          value: "10"   # 둘째 날부터 새 방 공개 시각
        - name: CONTENT
          value: "/bot/quizzes.json"
        - name: DB_HOST
          value: mysql
        - name: PYTHONUNBUFFERED
          value: "1"
      command: ["sh", "-c", "pip install -q pymysql && python /bot/quizbot.py"]
      volumeMounts:
        - name: script
          mountPath: /bot
      resources:
        requests: { cpu: 50m, memory: 96Mi }
        limits: { cpu: 500m, memory: 256Mi }
  volumes:
    - name: script
      configMap:
        name: demo1110-scripts
