# Vite 빌드 산출물(dist)을 그대로 내보내는 정적 서버 설정.
# 컨테이너의 /etc/nginx/conf.d/default.conf 를 대체한다(Dockerfile 2단계).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ALB 타깃그룹 헬스체크 + kubelet 프로브 공용.
    # index.html 을 쓰지 않는 이유: 정적 파일 배치와 무관하게 nginx 생존만 보게 하려는 것이고,
    # 헬스체크가 매번 번들 HTML 을 실어 보내지 않게 하려는 것이다.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite 가 파일명에 콘텐츠 해시를 박으므로 내용이 바뀌면 이름이 바뀐다 → 영구 캐시가 안전하다.
    # try_files =404 로 못 박는 이유: 없는 자산이 아래 SPA fallback 에 걸리면 JS 를 요청했는데
    # index.html 이 200 으로 돌아와 "Unexpected token '<'" 같은 엉뚱한 에러로 번진다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ⚠ index.html 은 절대 캐시하지 않는다. 자산 해시가 적힌 곳이 여기라, 캐시되면 새 버전을
    #   배포해도 브라우저가 옛 번들을 계속 참조한다(배포했는데 안 바뀌는 전형적 증상).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — 실제 파일이 없으면 index.html 로 넘겨 react-router 가 경로를 해석한다.
    # 없으면 /login 직접 진입이나 새로고침이 전부 nginx 404 가 된다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ALB 는 압축을 대신해 주지 않는다 — 여기서 켜지 않으면 번들이 원본 크기로 나간다.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
