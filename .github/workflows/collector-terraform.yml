# collector-lambda 테라폼 CI — "dev_infra 머지 = 인프라 배포"
#
# PR(dev_infra 대상)  : fmt/validate 만 (AWS 접근 없음)
# push(dev_infra 머지): OIDC 로 kbo-collector-terraform-ci 롤 assume → plan → apply
#
# 필요한 리포 Secrets: TF_VAR_db_password, TF_VAR_pii_salt
# (그 외 설정값은 커밋된 collector-lambda/config.auto.tfvars 에서 로드)
name: collector-terraform

on:
  pull_request:
    branches: [dev_infra]
    paths: ['VictoryFairy_Infra/collector-lambda/**']
  push:
    branches: [dev_infra]
    paths: ['VictoryFairy_Infra/collector-lambda/**']
  workflow_dispatch:

permissions:
  id-token: write # OIDC 토큰 발급
  contents: read

# apply 동시 실행 금지 (state 락과 이중 안전장치)
concurrency:
  group: collector-terraform
  cancel-in-progress: false

env:
  TF_VERSION: 1.15.8
  AWS_REGION: ap-northeast-2

defaults:
  run:
    working-directory: VictoryFairy_Infra/collector-lambda

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  apply:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: collector-lambda
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::555209622409:role/kbo-collector-terraform-ci
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -input=false
      - run: terraform plan -input=false -out=tfplan
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_pii_salt: ${{ secrets.TF_VAR_PII_SALT }}
      - run: terraform apply -input=false tfplan
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_pii_salt: ${{ secrets.TF_VAR_PII_SALT }}
