name: Deploy to EKS

# EKS 배포 파이프라인 (기존 deploy.yml 의 EC2+compose 모델을 대체하는 신규 경로)
#
#   push(main) → 변경 모듈 감지 → Docker 빌드 → ECR push(커밋 SHA 태그, IMMUTABLE)
#   → 매니페스트 플레이스홀더 치환 → kubectl apply → 블루-그린식 롤아웃
#     (매니페스트 strategy: maxSurge 100%/maxUnavailable 0)
#
# 단일 진실 공급원은 VictoryFairy_Infra/k8s/*-app.yaml 이다. 종전의 `kubectl set image` 는
#   이미지만 갈아끼워 매니페스트와 클러스터 실제 상태가 계속 벌어졌다(예: 매니페스트에 있는
#   IRSA ServiceAccount 가 클러스터에 반영되지 않아 사람이 손으로 apply/patch 해야 했다).
#   이제 매 배포마다 파일 전체를 apply 하므로 Deployment 뿐 아니라 Service·HPA·SA 도 함께 수렴한다.
#
# 인증: GitHub OIDC → AWS IAM 역할(victoryfairy-dev-github-actions) AssumeRole.
#   시크릿(액세스 키) 저장 없음. 역할은 terraform modules/security 가 관리하며
#   ECR push(지정 리포지토리) + EKS victoryfairy 네임스페이스 Edit 로 제한됨.
#
# 롤백: 실패 시 자동 rollout undo. 수동 롤백은 docs/DEPLOYMENT.md 참고.

on:
  push:
    branches: [main]
    paths:
      - "VictoryFairy_BE/**"
      - ".github/workflows/deploy-eks.yml"
  workflow_dispatch:
    inputs:
      modules:
        description: "배포할 모듈 (공백 구분: user quiz)"
        default: "user quiz"
        required: true

permissions:
  id-token: write # OIDC 토큰 발급 (AWS AssumeRole)
  contents: read

env:
  AWS_REGION: ap-northeast-2
  # = terraform output github_actions_role_arn
  ROLE_ARN: arn:aws:iam::555209622409:role/victoryfairy-dev-github-actions
  CLUSTER: victoryfairy-dev
  NAMESPACE: victoryfairy

jobs:
  # ── 0단계: 어떤 모듈을 배포할지 판단 ─────────────────────────────
  detect:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set.outputs.modules }} # JSON 배열 (예: ["user","quiz"])
    steps:
      - uses: actions/checkout@v5

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            shared:
              - "VictoryFairy_BE/common/**"
              - "VictoryFairy_BE/domain/**"
              - "VictoryFairy_BE/build.gradle"
              - "VictoryFairy_BE/settings.gradle"
              - "VictoryFairy_BE/gradle/**"
              - "VictoryFairy_BE/Dockerfile"
              - ".github/workflows/deploy-eks.yml"
            user:
              - "VictoryFairy_BE/user/**"
              # 시드 SQL 은 user 이미지 안에 구워진다(user/build.gradle processResources →
              # user prod 의 spring.sql.init). 이 경로가 빠지면 SQL 만 고쳤을 때 재빌드가 걸리지
              # 않아 이미지 속 시드가 낡은 채로 남는다. quiz 는 더 이상 이 파일을 싣지 않으므로
              # shared 가 아니라 user 에만 넣는다.
              - "VictoryFairy_BE/infra/sql/**"
            quiz:
              - "VictoryFairy_BE/quiz/**"

      - name: Compute module set
        id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODS="${{ inputs.modules }}"
          elif [ "${{ steps.filter.outputs.shared }}" = "true" ]; then
            MODS="user quiz"   # 공용 모듈 변경 → 전체 재배포
          else
            MODS=""
            [ "${{ steps.filter.outputs.user }}" = "true" ] && MODS="$MODS user"
            [ "${{ steps.filter.outputs.quiz }}" = "true" ] && MODS="$MODS quiz"
          fi
          JSON=$(echo $MODS | tr ' ' '\n' | grep -v '^$' | sort -u | jq -Rcs 'split("\n") | map(select(length>0))')
          echo "modules=$JSON" >> "$GITHUB_OUTPUT"
          echo "배포 대상: $JSON"

  # ── 1단계: 모듈별 빌드 → ECR push → EKS 배포 (병렬) ──────────────
  build-deploy:
    needs: detect
    if: needs.detect.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect.outputs.modules) }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve BE dir
        id: be
        run: |
          [ -f "VictoryFairy_BE/Dockerfile" ] || { echo "::error::VictoryFairy_BE/Dockerfile 를 찾지 못했습니다"; exit 1; }
          echo "dir=VictoryFairy_BE" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        id: img
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG="${GITHUB_SHA::7}"
          REPO="victoryfairy-${{ matrix.module }}"
          IMG="$REGISTRY/$REPO:$TAG"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          # IMMUTABLE 태그: 이미 존재하면(재실행 등) 빌드/푸시 생략
          if aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "태그 $TAG 이미 존재 — 빌드 생략"; exit 0
          fi
          docker build --build-arg MODULE=${{ matrix.module }} \
            -t "$IMG" "${{ steps.be.outputs.dir }}"
          docker push "$IMG"

      - name: Deploy to EKS (manifest apply + blue-green rollout)
        id: deploy
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: ${{ steps.img.outputs.image }} # 위 스텝이 실제로 push(또는 재사용)한 이미지
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER"

          # 모듈 → 매니페스트 매핑. 파일명이 번호 접두사로 시작해 규칙 유도가 불가하므로 명시한다.
          # 모듈을 늘리면 여기도 같이 늘려야 한다(빠뜨리면 조용히 건너뛰지 않고 즉시 실패).
          case "${{ matrix.module }}" in
            user) MANIFEST="20-user-app.yaml" ;;
            quiz) MANIFEST="21-quiz-app.yaml" ;;
            *) echo "::error::매니페스트 매핑이 없는 모듈: ${{ matrix.module }}"; exit 1 ;;
          esac
          SRC="VictoryFairy_Infra/k8s/$MANIFEST"
          # 매니페스트는 checkout 된 저장소 트리에 있다(main 은 BE·Infra 를 함께 갖는다).
          [ -f "$SRC" ] || { echo "::error::$SRC 를 찾지 못했습니다 — 매니페스트가 러너에 체크아웃되지 않았습니다"; exit 1; }

          TAG="${GITHUB_SHA::7}"
          RENDERED="$RUNNER_TEMP/$MANIFEST"
          sed -e "s|<ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com|$REGISTRY|g" \
              -e "s|<commit-sha>|$TAG|g" \
              "$SRC" > "$RENDERED"

          # ── 치환 검증: 여기서 조용히 넘어가면 플레이스홀더가 그대로 apply 되어 ImagePullBackOff 로 죽는다 ──
          # (1) 실제 push 한 이미지가 렌더 결과에 있는가.
          #     플레이스홀더 형식이나 리포지토리 이름이 바뀌어 sed 가 헛돌면 여기서 걸린다.
          grep -Fq "$IMAGE" "$RENDERED" || {
            echo "::error::렌더 결과에 $IMAGE 가 없습니다 — 매니페스트 플레이스홀더 형식과 CI 치환 규칙이 어긋났습니다"
            exit 1
          }
          # (2) <...> 형태의 미치환 토큰이 이미지 외 필드에도 남았는가.
          #     주석 줄은 제외한다 — 매니페스트 머리 주석이 플레이스홀더 규약 자체를 설명하느라
          #     <ACCOUNT_ID> 를 문자 그대로 적고 있고, 그건 apply 되지 않으므로 무해하다.
          #     (grep -n 을 먼저 걸어 원본 줄 번호를 유지한 뒤 주석 줄만 걷어낸다)
          LEFT=$(grep -nE '<[A-Za-z0-9_.-]+>' "$RENDERED" | grep -vE '^[0-9]+:[[:space:]]*#' || true)
          if [ -n "$LEFT" ]; then
            echo "$LEFT"
            echo "::error::치환되지 않은 플레이스홀더가 남았습니다(위 라인) — apply 중단"
            exit 1
          fi

          # 파일 전체를 적용: Deployment 외에 Service·HPA·ServiceAccount 도 매니페스트대로 수렴한다.
          kubectl -n "$NAMESPACE" apply -f "$RENDERED"
          # strategy(maxSurge 100%/maxUnavailable 0)에 따라 신버전 전체 기동 후 전환
          kubectl -n "$NAMESPACE" rollout status "deploy/${{ matrix.module }}-app" --timeout=300s

      - name: Rollback on failure
        # 배포 스텝이 실패했을 때만 돈다. 그냥 failure() 로 두면 빌드 실패나 매니페스트 치환 검증
        # 실패처럼 **클러스터를 건드리지도 않은** 실패에서도 rollout undo 가 돌아, 멀쩡히 서비스 중인
        # 파드를 직전 리비전으로 내린다. apply 전환으로 apply 이전 실패 지점이 늘어 노출이 커졌다.
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          # ⚠ 한계: apply 는 Deployment·Service·HPA·ServiceAccount 를 함께 반영하지만
          #   rollout undo 는 Deployment(파드 템플릿)만 직전 리비전으로 되돌린다.
          #   같은 커밋에서 Service/HPA/SA 를 함께 바꿨다면 그 변경은 클러스터에 남는다.
          #   → 그쪽까지 되돌리려면 직전 커밋의 매니페스트를 다시 apply 해야 한다(수동, docs/DEPLOYMENT.md).
          echo "::warning::롤아웃 실패 — 직전 버전으로 자동 롤백(Deployment 한정)"
          kubectl -n "$NAMESPACE" rollout undo "deploy/${{ matrix.module }}-app" || true
          kubectl -n "$NAMESPACE" rollout status "deploy/${{ matrix.module }}-app" --timeout=180s || true
