# fe-app: Vite 빌드 산출물(dist)을 nginx 가 서비스하는 정적 프런트엔드.
#
# ⚠ 이 워크로드는 폐기 예정이다. FE 는 S3+CloudFront 가 서비스하고(docs/fe-cdn-migration.md),
#   CloudFront 는 '/' 를 ALB 로 보내지 않으므로 이 파드는 평소 트래픽을 받지 않는다.
#   루트 도메인을 다시 ALB 로 되돌리는 전환 롤백을 위해서만 남겨 둔 것이며, 정리 3단계에서
#   victoryfairy-fe Ingress 와 함께 삭제한다. 배포 워크플로(deploy-fe.yml)는 더 이상 이
#   Deployment 의 이미지를 갱신하지 않는다 — 여기 박힌 이미지는 전환 직전 버전에서 멈춘다.
#
# 인프라 커플링:
#   app 노드그룹(label workload=app, taint 없음)에 user·quiz 와 동거 → nodeSelector 만으로 스케줄.
#   컨테이너 포트가 80 이 아니라 8080 인 이유: 이미지가 nginx-unprivileged(비루트 uid 101) 기반이라
#   1024 미만 포트를 열 수 없다. VictoryFairy_FE/nginx.conf 의 listen, 아래 containerPort,
#   Service 의 targetPort 셋이 모두 8080 으로 일치해야 한다.
#
# ⚠ 적용 순서: 이 파일을 먼저 적용해 파드가 Ready 가 된 뒤에 22-ingress.yaml 을 적용할 것.
#   뒤집으면 타깃 없는 '/' 규칙이 ALB 에 붙어 사이트 전체가 503 이 된다(파일명은 24 지만 22 보다 먼저다).
#
# ⚠ ConfigMap/Secret 이 없는 것은 누락이 아니다. API base URL 은 Vite 가 빌드 시점에 번들에
#   문자열로 박아버려 런타임 주입이 불가능하다. 주소를 바꾸려면 재배포가 아니라 재빌드가 필요하다.
#   현재 상대 경로(/api/member·/api/game)로 굽고 있으므로 FE 와 API 가 같은 오리진이라는 전제가
#   깨지면(FE 를 다른 도메인으로 옮기면) 그 순간 API 호출이 전부 깨진다.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe-app
  namespace: victoryfairy
  labels:
    app: fe-app
spec:
  replicas: 1 # HPA minReplicas 와 정합(dev 단계 — 평소 1대)
  # user/quiz 와 동일한 블루-그린식 업데이트.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: fe-app
  template:
    metadata:
      labels:
        app: fe-app
    spec:
      nodeSelector:
        workload: app
      # ⚠ preferred 여야 한다. required 로 걸면 노드가 1대인 현재 두 번째 파드가 영구 Pending 이 된다.
      #   노드가 늘어나면 자동으로 서로 다른 노드에 흩어진다.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: fe-app
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # 이미지의 nginx 사용자. 이미지를 바꾸면 함께 확인할 것
      containers:
        - name: fe
          # ⚠ 불변 태그(커밋 SHA). latest 금지.
          # TODO: <ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com/victoryfairy-fe 로 교체
          # 최초 1회는 이 값이 실재하지 않아 ImagePullBackOff 가 난다 — 워크플로가 한 번 돌면
          # kubectl set image 로 실제 태그가 박히고 이후엔 문제되지 않는다.
          image: "<ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com/victoryfairy-fe:<commit-sha>"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # ⚠ requests.cpu 를 10m 수준으로 더 낮추지 말 것. HPA 는 requests 대비 비율로 판단하므로
          #   요청이 지나치게 작으면 평소 노이즈에도 상한까지 튀어 HPA 가 사실상 상시 2대가 된다.
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          # nginx.conf 가 제공하는 전용 엔드포인트. index.html 을 쓰지 않는 이유는 nginx.conf 주석 참고.
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
            failureThreshold: 10
            periodSeconds: 2 # 정적 서버라 1초 내 기동. JVM(최대 150s 허용)과 달리 짧게 잡는다
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 15
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: fe-app
  namespace: victoryfairy
  labels:
    app: fe-app
spec:
  type: ClusterIP
  selector:
    app: fe-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
# HPA: 평소 1 → 최대 2.
#
# 정적 파일 서빙은 CPU 를 거의 쓰지 않아 이 HPA 는 실전에서 거의 발화하지 않는다. 그럼에도 두는
# 이유는 부하 대응이 아니라 급증 시의 안전판이며, 진짜 부하 완화는 nginx.conf 의 캐시 헤더가 한다
# (해시 자산 immutable → 재방문 트래픽이 파드에 도달하지 않는다).
#
# PDB 를 두지 않은 것도 의도적이다. replicas 1 인 상태에서 minAvailable:1 PDB 를 걸면 파드를
# 축출할 수 없어 노드 드레인이 영구히 막힌다. 상시 2대로 올릴 때 함께 추가할 것.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fe-app
  namespace: victoryfairy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fe-app
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70 # requests.cpu(50m) 대비
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # 급격한 축소 방지(user-app 과 동일)
