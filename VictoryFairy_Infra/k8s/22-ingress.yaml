# ALB Ingress: AWS Load Balancer Controller 가 이 Ingress 들을 보고 실제 ALB 를 만든다.
#   /api -> user-app, /rt -> quiz-app, 그 외 전부 -> fe-app (pathType: Prefix 라 하위 경로 포함).
#
# ⚠ 이 ALB 는 더 이상 사용자의 첫 관문이 아니다. FE 정적 호스팅 전환(docs/fe-cdn-migration.md)
#   이후 브라우저는 CloudFront 에 붙고, CloudFront 가 /api/*·/rt/* 만 이 ALB 로 넘긴다.
#   CloudFront 는 Host 헤더를 그대로 전달하므로(modules/cdn 의 Managed-AllViewer) 아래 host 조건은
#   victoryfairy.com 그대로 유지된다 — CloudFront 경유와 브라우저 직접 접속이 같은 규칙을 쓴다.
#
# ⚠ Ingress 가 여러 개인 이유 — 헬스체크 경로가 앱마다 다르기 때문이다.
#   healthcheck-path 는 Ingress 단위 어노테이션이라 하나로는 두 값을 담을 수 없다. 앱이
#   server.servlet.context-path(/api, /rt)를 쓰므로 actuator 경로도 접두사를 따라 갈린다.
#   그래서 Ingress 를 쪼개되 group.name 을 같게 주어 ALB 는 하나로 유지한다.
#
# ⚠ group.order 는 곧 규칙 평가 순서다. FE 의 '/' 는 모든 경로를 삼키므로 반드시 API 보다
#   뒤(=큰 값)여야 한다. 10 user → 20 quiz → 30 fe. FE 를 앞으로 옮기면 API 가 전부 FE 로 간다.
#
# ⚠ ALB 는 forward 시 경로를 rewrite 하지 않는다(redirect 만 가능). 여기의 path 는 앱이 실제로
#   서비스하는 context-path 와 문자 그대로 일치해야 한다 — 다르면 파드까지 도달해도 404 다.
#   CloudFront 도 경로를 바꾸지 않는다(SPA fallback 함수는 S3 behavior 에만 붙는다).
#
# ⚠ 적용 순서: BE 가 새 context-path(/api, /rt)로 배포된 뒤에 apply 할 것. 헬스체크 경로가 함께
#   바뀌므로 뒤집으면 타깃이 전부 Unhealthy 가 되어 순단이 수십 초에서 수 분으로 늘어난다.
#   한 앱이 두 context-path 를 동시에 서비스할 수 없어 겹치는 구간은 만들 수 없다
#   (docs/fe-cdn-migration.md §5).
#
# ── DNS 소유권 ────────────────────────────────────────────────────────────────
# 아래 앱 Ingress 는 **전부 external-dns controller: none** 이다. 즉 ExternalDNS 는 이들의 host 를
# 보고 레코드를 만들지 않는다. 루트 도메인(victoryfairy.com)은 Terraform(modules/cdn)이 CloudFront
# ALIAS 로 소유하기 때문이다. 둘이 같은 레코드를 관리하면 1분마다 서로 되돌리며 싸운다.
#
# 대신 맨 아래 victoryfairy-dns-origin 이 origin.victoryfairy.com 하나만 ExternalDNS 에 알린다.
# ExternalDNS 는 --policy=upsert-only 라 레코드를 지우지 않으므로, controller: none 으로 바꿔도
# 기존 루트 레코드는 남는다(전환 1단계에서 트래픽이 변하지 않는 이유).
# ──────────────────────────────────────────────────────────────────────────────
#
# 전제(모두 Terraform 으로 프로비저닝됨):
#   - LBC IRSA 역할 (modules/alb) + LBC Helm 설치 (runbook) → IngressClass "alb"
#   - 퍼블릭 서브넷 태그 kubernetes.io/role/elb=1 (modules/network) → LBC 가 서브넷 자동 탐색
#   - ACM 인증서 (modules/dns) → LBC 가 host 로 인증서 자동 탐색 → HTTPS 종료.
#     apex 인증서와 origin 전용 인증서 두 장이며, LBC 가 아래 host 들을 보고 각각 찾아 SNI 로
#     리스너에 붙인다(apex 인증서에 SAN 을 추가하지 않는 이유는 modules/dns/main.tf §2-1).
#     ⚠ origin 인증서가 리스너에 붙지 않으면 CloudFront 가 오리진 TLS 이름 불일치로 연결을
#       거부해 API 가 전부 502 가 된다. apply 후 리스너 인증서 목록을 확인할 것.
#   - ExternalDNS (k8s/23-external-dns.yaml) → origin 레코드 자동 생성
#
# 주의: LB 자체에 걸리는 어노테이션(scheme·listen-ports·ssl-redirect)은 같은 group 의 모든
#   Ingress 에서 값이 일치해야 한다. 다르면 LBC 가 그룹 구성에 실패한다.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: victoryfairy-user
  namespace: victoryfairy
  annotations:
    # 루트 도메인은 Terraform 이 CloudFront 로 소유한다(파일 상단 'DNS 소유권' 참고).
    external-dns.alpha.kubernetes.io/controller: none
    alb.ingress.kubernetes.io/group.name: victoryfairy
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443' # 80 → 443 자동 리다이렉트
    # HTTPS(TLS) 인증서: 어노테이션을 생략하면 LBC 가 아래 host 와 도메인이 일치하는 ACM 인증서를
    #   자동 탐색해 붙인다(modules/dns 가 발급). 명시하려면 주석 해제:
    # alb.ingress.kubernetes.io/certificate-arn: <terraform output acm_certificate_arn>
    #
    # 헬스체크: user-app 의 context-path(/api) 아래 actuator readiness.
    #   ⚠ /actuator/health 전체가 아니라 readiness 그룹이다. 전체 health 는 db·redis 인디케이터를
    #     합산해 DOWN 을 내므로 MySQL EC2 가 흔들리면 멀쩡한 파드까지 타깃에서 빠진다.
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /api/actuator/health/readiness
spec:
  ingressClassName: alb
  rules:
    - host: victoryfairy.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: user-app
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: victoryfairy-quiz
  namespace: victoryfairy
  annotations:
    external-dns.alpha.kubernetes.io/controller: none
    alb.ingress.kubernetes.io/group.name: victoryfairy
    alb.ingress.kubernetes.io/group.order: "20"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    #
    # 헬스체크: quiz-app 의 context-path(/rt) 아래 actuator readiness.
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /rt/actuator/health/readiness
spec:
  ingressClassName: alb
  rules:
    - host: victoryfairy.com
      http:
        paths:
          # /rt = realtime. 채팅 SSE 가 여기로 들어온다.
          # ⚠ CloudFront 의 이 경로 behavior 는 캐시를 끄고 압축도 끈다(modules/cdn) — 엣지가
          #   text/event-stream 을 버퍼링하거나 캐시하면 실시간성이 깨진다.
          - path: /rt
            pathType: Prefix
            backend:
              service:
                name: quiz-app
                port:
                  number: 80
---
# ⚠ 이 Ingress 는 전환 롤백용으로만 남아 있다.
#   FE 는 이제 S3+CloudFront 가 서비스한다. CloudFront 는 '/' 를 이 ALB 로 보내지 않으므로 이
#   규칙은 평소 트래픽을 받지 않는다. 루트 도메인을 다시 ALB 로 되돌릴 때(전환 롤백) 비로소
#   사용된다 — 그래서 fe-app 워크로드(24-fe-app.yaml)와 함께 정리 3단계까지 남긴다.
#   제거 절차: docs/fe-cdn-migration.md §4 3단계.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: victoryfairy-fe
  namespace: victoryfairy
  annotations:
    external-dns.alpha.kubernetes.io/controller: none
    alb.ingress.kubernetes.io/group.name: victoryfairy
    # ⚠ 반드시 API(10·20)보다 뒤. '/' 가 모든 경로를 삼키므로 앞에 오면 API 가 전부 FE 로 간다.
    alb.ingress.kubernetes.io/group.order: "30"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    #
    # 헬스체크: nginx.conf 가 제공하는 전용 엔드포인트(정적 파일 배치와 무관하게 nginx 생존만 본다).
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  ingressClassName: alb
  rules:
    - host: victoryfairy.com
      http:
        paths:
          # SPA 라 딥링크(/login, /chat/…)가 서버 경로로 존재하지 않는다. 전부 fe-app 으로 보내면
          # nginx 의 try_files fallback 이 index.html 을 내준다.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fe-app
                port:
                  number: 80
---
# victoryfairy-dns-origin: ExternalDNS 에게 origin.victoryfairy.com 을 알리는 것이 유일한 목적이다.
#
# 왜 필요한가: CloudFront 는 오리진에 HTTPS 로 붙을 때 오리진 도메인 이름과 오리진이 제시한
#   인증서가 일치하는지 검증한다. ALB 의 실제 주소(k8s-*.elb.amazonaws.com)는 victoryfairy.com
#   인증서와 이름이 어긋나 거부되므로, 인증서가 커버하는 별도 이름이 ALB 를 가리켜야 한다.
#   그 A 레코드를 만드는 주체가 ExternalDNS 이고, ExternalDNS 는 Ingress 의 host 만 보므로
#   이 Ingress 가 존재한다. Terraform 은 LBC 가 만든 ALB 의 주소를 알 수 없어 대신할 수 없다.
#
# ⚠ 이 Ingress 를 지우면 origin 레코드의 관리자가 사라진다. upsert-only 라 레코드 자체는 남지만
#   ALB 가 재생성되면(주소 변경) 갱신되지 않아 API 가 통째로 죽는다.
# ⚠ 아래 리스너 규칙은 평소 매칭되지 않는다 — CloudFront 가 Host 를 victoryfairy.com 으로
#   전달하기 때문이다(modules/cdn 의 Managed-AllViewer). 오리진 요청 정책을
#   AllViewerExceptHostHeader 로 바꾸는 날 이 규칙이 실제 경로가 된다.
# ⚠ healthcheck-path 는 user Ingress 와 같은 값이어야 한다. 같은 서비스(user-app)를 참조하는
#   Ingress 가 서로 다른 값을 주면 LBC 가 타깃그룹 설정을 두고 흔들린다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: victoryfairy-dns-origin
  namespace: victoryfairy
  annotations:
    alb.ingress.kubernetes.io/group.name: victoryfairy
    alb.ingress.kubernetes.io/group.order: "40" # 앞선 규칙과 겹치지 않으므로 순서는 무관
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /api/actuator/health/readiness
spec:
  ingressClassName: alb
  rules:
    - host: origin.victoryfairy.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: user-app
                port:
                  number: 80
