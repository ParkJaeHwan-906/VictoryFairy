# Namespaces
# - victoryfairy       : 상시 서비스 워크로드(user / quiz)
# - victoryfairy-batch : 야간 배치 파이프라인(CronJob / 워커 / 배치 전용 임시 Redis)
#
# 배치를 별도 네임스페이스로 가르는 이유: 배치는 batch 노드그룹(Spot, 0->N->0)에서만
# 떴다 사라지는 일시적 워크로드라, 서비스 워크로드와 리소스쿼터/네트워크폴리시/RBAC를
# 분리해 blast radius를 줄인다. (ARCHITECTURE §4, §5)
apiVersion: v1
kind: Namespace
metadata:
  name: victoryfairy
  labels:
    app.kubernetes.io/part-of: victoryfairy
    tier: service
    # 새 파드가 ALB 대상에서 healthy 가 될 때까지 Ready 로 치지 않게 해, 롤링 중 구 파드가
    # 먼저 내려가 대상 0개가 되는 틈을 막는다. 웹훅 failurePolicy=Ignore 라 컨트롤러 장애 시에도
    # 파드 생성은 막히지 않는다. 라벨은 이후 생성되는 파드에만 적용된다.
    elbv2.k8s.aws/pod-readiness-gate-inject: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: victoryfairy-batch
  labels:
    app.kubernetes.io/part-of: victoryfairy
    tier: batch
---
# kube-prometheus-stack(Helm) 설치 대상. monitoring 노드그룹에서만 돈다(k8s/61-*.values.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: victoryfairy
    tier: monitoring
