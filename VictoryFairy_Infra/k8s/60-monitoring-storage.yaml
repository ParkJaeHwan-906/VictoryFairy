# gp3 StorageClass — Prometheus·Grafana PVC 용. EBS CSI 애드온(modules/eks/ebs_csi.tf)이 있어야 동작한다.
#
# 기존 gp2 클래스(kubernetes.io/aws-ebs)는 in-tree 프로비저너라 1.23+ 에서는 볼륨을 만들지 못한다.
# 기본 클래스로 지정하지 않는다 — 다른 워크로드가 의도치 않게 EBS 를 잡지 않게 values 에서 이름으로만 쓴다.
#
# reclaimPolicy Retain: helm uninstall 로 PVC 가 지워져도 EBS 는 남는다. 지표 이력을 실수로 날리지
#   않기 위함이다. 정말 버릴 때는 PV 와 EBS 볼륨을 직접 지울 것(안 지우면 GB 당 과금이 계속된다).
# WaitForFirstConsumer: 파드가 잡힌 노드의 AZ(2a)에 볼륨을 만든다. Immediate 로 두면 2c 에 생겨
#   파드가 영영 스케줄되지 않을 수 있다.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
