# quiz-app: 실시간 채팅/퀴즈 Spring 모듈(:quiz, 컨테이너 포트 8081, 경로 /rt — BE PR #191)
#
# 인프라 커플링(설계 변경 2026-07 — user·quiz 공용 app 노드풀):
#   app 노드그룹 = label workload=app, taint 없음. user·quiz 파드가 같은 노드에 동거.
#   -> nodeSelector 만으로 스케줄. toleration 불필요(taint 격리 제거됨).
#
# 스케일 관계(중요):
#   HPA -> 파드 수를 늘린다(max 4).  파드가 Pending 되면 -> Cluster Autoscaler 가
#   app 노드풀에 신규 EC2 노드를 붙인다(노드 min1/max4). 즉 HPA는 노드가 아니라
#   파드를 늘리고, 노드 증설은 CA가 담당한다.
#
# 다중 파드 팬아웃: 실시간 SSE는 파드가 여러 개면 서비스 Redis pub/sub 로 파드 간 이벤트를
#   팬아웃한다(ARCHITECTURE §3). 그래서 세션 어피니티 없이도 수평 확장 안전.
#
# 배포 방식(이 파일이 단일 진실 공급원):
#   CI(deploy-eks.yml)가 아래 image 라인의 <ACCOUNT_ID>/<commit-sha> 플레이스홀더를 실제 값으로
#   치환한 뒤 `kubectl apply -f` 로 이 파일 전체를 적용한다. 더 이상 `kubectl set image` 로
#   이미지만 바꾸지 않는다 — SA/프로브/리소스 등 여기 적은 모든 필드가 매 배포마다 반영된다.
#   ⚠ 그래서 이 파일을 그대로(치환 없이) 손으로 apply 하면 안 된다. 플레이스홀더 문자열이
#     이미지 태그로 들어가 파드가 ImagePullBackOff 로 죽는다. 변경은 커밋 → CI 로만.
#   ⚠ 플레이스홀더 문자열 형식은 CI 치환 규칙과 짝이다. 형식을 바꾸려면 CI 도 같이 고쳐야 한다.
---
# IRSA: 이 역할이 S3 크롤 버킷의 quiz-candidates/* 읽기 권한을 준다 — 퀴즈 적재기(BE :quiz)가
#   매일 후보 JSON 을 RDB 로 옮긴다. 역할 정의는 modules/quiz-irsa,
#   ARN = terraform output quiz_app_role_arn (이름 기반이라 값이 고정됨 — external-dns 와 동일 방식).
# 토큰 주입은 파드 '생성' 시점이라 기존 파드에는 적용되지 않지만, 배포마다 apply + 새 이미지 태그로
#   파드가 새로 뜨므로 rollout restart 같은 수동 절차는 필요 없다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quiz-app
  namespace: victoryfairy
  labels:
    app: quiz-app
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::555209622409:role/victoryfairy-dev-quiz-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-app
  namespace: victoryfairy
  labels:
    app: quiz-app
spec:
  # replicas 는 의도적으로 없다(지운 게 아니다 — 되돌리지 말 것).
  #   레플리카 수의 소유권은 하단 HPA(min1/max4)에 있다. CI 가 매 배포마다 이 파일을 apply 하므로
  #   replicas 를 여기 두면 HPA 가 3으로 올려둔 것을 배포가 1로 되돌리고 HPA 가 다시 올리는 싸움이 난다.
  #   생략 시 최초 생성만 기본값 1로 뜨고, 이후 스케일은 HPA 가 결정한다.
  # 블루-그린식 업데이트: 신버전 파드 '전체'를 먼저 띄우고(maxSurge 100%),
  # 구버전은 신버전이 Ready 될 때까지 하나도 내리지 않는다(maxUnavailable 0).
  # readiness 프로브 통과 → 트래픽 전환 → 구버전 종료. 실패 시 구버전이 그대로 서비스.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  revisionHistoryLimit: 10 # 롤백용 이전 ReplicaSet 보관(kubectl rollout undo)
  selector:
    matchLabels:
      app: quiz-app
  template:
    metadata:
      labels:
        app: quiz-app
    spec:
      serviceAccountName: quiz-app # IRSA — 위 SA 의 role-arn 어노테이션이 S3 읽기 자격증명을 준다
      # ── 인프라 커플링: app 공용 노드그룹 label 과 정확히 일치 ──
      nodeSelector:
        workload: app
      containers:
        - name: quiz
          # ⚠ 불변 태그(커밋 SHA). latest 금지.
          image: "<ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com/victoryfairy-quiz:<commit-sha>"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          # ⚠ 파드 시간대. user-app 과 반드시 같은 값이어야 한다(같은 DB 에 같은 컬럼을 쓴다).
          #   미설정이면 JVM 이 UTC 로 돌아 LocalDateTime 컬럼이 UTC 벽시계로 저장된다.
          #   quiz 는 여기에 하나가 더 걸린다 — 제출 시한(8분)이 `created_at` 과 앱의 현재 시각을
          #   같은 존으로 비교해 성립한다(QuizSubmitWindow). 두 파드의 TZ 가 어긋나면 한쪽이 만든
          #   행을 다른 쪽이 9시간 과거로 읽어 제출이 즉시 403 이 된다.
          #   quiz_date 판정용 kstClock 과는 별개 축이다(그건 코드에 KST 로 고정돼 있다).
          env:
            - name: TZ
              value: "Asia/Seoul"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            requests:
              cpu: "300m"       # HPA CPU 기준선 -> 이 값 대비 utilization 계산됨
              memory: "512Mi"
            limits:
              cpu: "700m"
              memory: "768Mi"
          startupProbe:
            tcpSocket: { port: 8081 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket: { port: 8081 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8081 }
            periodSeconds: 15
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-app
  namespace: victoryfairy
  labels:
    app: quiz-app
spec:
  type: ClusterIP
  selector:
    app: quiz-app
  ports:
    - name: http
      port: 80
      targetPort: 8081
      protocol: TCP
---
# HPA: CPU 기준 파드 오토스케일.
#   minReplicas 1  : 기본 1파드(유휴 자원 절약 — dev). ⚠ 단일 파드 구간 재시작 시 잠깐 중단 가능,
#                    운영 진입 시 2로 상향 권장(가용성 + Redis pub/sub 팬아웃 전제)
#   maxReplicas 4  : 설계 상한(user 2 + quiz 4 파드가 app 공용 노드풀에 동거).
#                    노드 자원이 차면 CA가 app 노드풀(min1/max4)을 수평 확장.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quiz-app
  namespace: victoryfairy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quiz-app
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60   # requests.cpu(300m) 대비 평균 60% 넘으면 스케일아웃
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300   # 급격한 축소 방지(채팅 커넥션 보호)
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
