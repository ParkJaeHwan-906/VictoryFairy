# user-app: 인증/유저 Spring 모듈(:user, 컨테이너 포트 8080, 경로 /api)
#
# 인프라 커플링(설계 변경 2026-07 — user·quiz 공용 app 노드풀):
#   app 노드그룹 = label workload=app, taint 없음. user·quiz 파드가 같은 노드에 동거.
#   -> nodeSelector 만으로 스케줄. toleration 불필요.
# 파드 규모: 기본 1 → 트래픽 증가 시 HPA 가 최대 2 (파일 하단 HPA 참조).
#   ⚠ 단일 파드 구간에서는 파드 재시작 시 잠깐 중단될 수 있음(dev 감수, 운영 시 min 2 권장).
# 노드 자원이 차면 Cluster Autoscaler 가 app 노드풀을 수평 확장(min1/max4).
#
# 배포 방식(이 파일이 단일 진실 공급원):
#   CI(deploy-eks.yml)가 아래 image 라인의 <ACCOUNT_ID>/<commit-sha> 플레이스홀더를 실제 값으로
#   치환한 뒤 `kubectl apply -f` 로 이 파일 전체를 적용한다. 더 이상 `kubectl set image` 로
#   이미지만 바꾸지 않는다 — 매니페스트에 적은 모든 필드가 매 배포마다 클러스터에 반영된다.
#   ⚠ 그래서 이 파일을 그대로(치환 없이) 손으로 apply 하면 안 된다. 플레이스홀더 문자열이
#     이미지 태그로 들어가 파드가 ImagePullBackOff 로 죽는다. 변경은 커밋 → CI 로만.
#   ⚠ 플레이스홀더 문자열 형식은 CI 치환 규칙과 짝이다. 형식을 바꾸려면 CI 도 같이 고쳐야 한다.
---
# IRSA: 이 역할이 자산 버킷(victoryfairy-asset)의 temp/·user-profile-img/ 접두사에만 읽기·쓰기·
#   삭제 권한을 준다 — 프로필 이미지 업로드(BE :user)가 파일을 올리고, 가입 확정 시 temp/ 에서
#   user-profile-img/ 로 옮기고, 정리 스케줄러가 미완주분을 지운다. 역할 정의는 modules/user-irsa,
#   ARN = terraform output user_app_role_arn (이름 기반이라 값이 고정됨 — quiz-app 과 동일 방식).
# 토큰 주입은 파드 '생성' 시점이라 기존 파드에는 적용되지 않지만, 배포마다 apply + 새 이미지 태그로
#   파드가 새로 뜨므로 rollout restart 같은 수동 절차는 필요 없다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-app
  namespace: victoryfairy
  labels:
    app: user-app
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::555209622409:role/victoryfairy-dev-user-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-app
  namespace: victoryfairy
  labels:
    app: user-app
spec:
  # replicas 는 의도적으로 없다(지운 게 아니다 — 되돌리지 말 것).
  #   레플리카 수의 소유권은 하단 HPA(min1/max2)에 있다. CI 가 매 배포마다 이 파일을 apply 하므로
  #   replicas 를 여기 두면 HPA 가 2로 올려둔 것을 배포가 1로 되돌리고 HPA 가 다시 올리는 싸움이 난다.
  #   생략 시 최초 생성만 기본값 1로 뜨고, 이후 스케일은 HPA 가 결정한다.
  # 블루-그린식 업데이트: 신버전 파드 '전체'를 먼저 띄우고(maxSurge 100%),
  # 구버전은 신버전이 Ready 될 때까지 하나도 내리지 않는다(maxUnavailable 0).
  # readiness 프로브 통과 → 트래픽 전환 → 구버전 종료. 실패 시 구버전이 그대로 서비스.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  revisionHistoryLimit: 10 # 롤백용 이전 ReplicaSet 보관(kubectl rollout undo)
  selector:
    matchLabels:
      app: user-app
  template:
    metadata:
      labels:
        app: user-app
    spec:
      serviceAccountName: user-app # IRSA — 위 SA 의 role-arn 어노테이션이 S3 자산 버킷 자격증명을 준다
      # ── 인프라 커플링: app 공용 노드그룹 label 과 정확히 일치 ──
      nodeSelector:
        workload: app
      containers:
        - name: user
          # ⚠ 불변 태그(커밋 SHA). latest 금지.
          image: "<ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com/victoryfairy-user:<commit-sha>"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # ⚠ 파드 시간대. 미설정이면 JVM 이 UTC 로 돌고, @CreationTimestamp 계열이 찍는
          #   LocalDateTime 컬럼(전 테이블 52개)이 UTC 벽시계로 저장된다 — 응답에 오프셋이 없어
          #   FE 가 로컬로 읽으면 9시간 과거로 보인다(채팅 시간 오표시의 원인).
          #   envFrom(app-config) 이 아니라 여기 두는 이유: app-config 는 클러스터에서 수기로
          #   관리돼 git 에 실물이 없다 — 시간대는 코드로 고정돼야 재현된다.
          #   베이스 이미지 eclipse-temurin:21-jre 에 tzdata 가 있어 이 값이 실제로 먹는다(실측).
          #   ⚠ 롤링 중에는 UTC 파드와 KST 파드가 공존한다 — 그 사이 쓰인 행은 존이 섞이므로
          #   데이터 백필과 같은 점검 창에서 함께 전환해야 한다.
          env:
            - name: TZ
              value: "Asia/Seoul"
            # 프로필 이미지 업로드(BE :user). 비밀이 아니라 Secret 이 아니고, app-config 가 아니라
            #   여기 둔다 — app-config 는 클러스터에서 수기로 관리되어 git 에 실물이 없고(CI 가 적용하지
            #   않는다) user 전용 값이라 quiz 와 공유할 이유도 없다. TZ 와 같은 판단 근거다.
            # ⚠ 버킷/접두사는 Terraform 의 단일 출처(environments/dev/locals.tf)와 문자 그대로
            #   일치해야 한다 — 어긋나면 IRSA 정책 조건에 걸려 업로드가 AccessDenied 로 죽는다.
            - name: USER_PROFILE_IMAGE_BUCKET
              value: "victoryfairy-asset"
            # 자산 버킷과 클러스터가 같은 리전(ap-northeast-2, environments/dev 기준).
            - name: USER_PROFILE_IMAGE_REGION
              value: "ap-northeast-2"
            # temp/ 정리 스케줄러 — 가입을 완주하지 않은 업로드를 지우는 1차 방어.
            #   끄면 S3 라이프사이클(modules/asset)만 남는데 그건 일 단위 안전망이라 반응이 느리다.
            - name: USER_CLEANUP_TEMP_PROFILE_IMAGE_ENABLED
              value: "true"
            # Spring 6필드 cron(초 분 시 일 월 요일). 매일 04:00 — 위 TZ=Asia/Seoul 이 적용된
            #   벽시계라 KST 다. modules/asset 의 라이프사이클 주석이 적은 "매일 04:00 KST" 와 짝이다.
            #   배치 파이프라인(03:15 KST)과 겹치지 않는다.
            # ⚠ HPA 로 파드가 2개면 두 파드가 각자 돌린다(리더 선출 없음). 이미 지운 객체를
            #   다시 지우는 일이라 멱등하지만, 삭제 외 부수효과가 생기면 이 전제가 깨진다.
            - name: USER_CLEANUP_TEMP_PROFILE_IMAGE_CRON
              value: "0 0 4 * * *"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          # SPRING_PROFILES_ACTIVE=prod 는 app-config에서 주입(앱 런타임 프로필, 인프라 env와 별개 축)
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"   # MaxRAMPercentage=70 로 힙 산정.
          startupProbe:
            tcpSocket: { port: 8080 }
            failureThreshold: 30
            periodSeconds: 5      # JVM 콜드스타트 최대 ~150s 허용
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 15
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: user-app
  namespace: victoryfairy
  labels:
    app: user-app
spec:
  type: ClusterIP
  selector:
    app: user-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
# HPA: 기본 1 파드 → CPU 부하 시 최대 2 (설계: user 파드 상한 2)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-app
  namespace: victoryfairy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-app
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60 # requests.cpu(250m) 대비 평균 60% 초과 시 스케일아웃
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # 급격한 축소 방지
