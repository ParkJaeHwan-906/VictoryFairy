# ⚠️ 초안 v0 — 사람 검수 전(검수 완료 시 이 줄 제거). routine 등록 전 검수 필수.
# KBO 역대 기록 시드 — gen_all_time_seed.py 초안 + 사람 검수 완료본.
# ⚠️ 규칙(스펙 4.1): 수치(value)는 참고용 — 퀴즈 정답으로 사용 금지(순위·최초달성형만).
#    논란성 항목(약물 등)은 검수 시 삭제. 나무위키 복사 금지 — 원천은 KBO 공식 기록실.
# rankBasis="chronological"인 카테고리는 MILESTONE_FIRST(최초 달성)용, "true-rank"는
#    ALL_TIME_LEADER(역대 1위)용 — 소비 시 반드시 구분할 것(정반대 의미).
# value 열은 "첫 번째로 숫자로 보이는 열" 규칙으로 자동 선택돼 헤드라인 통계가 아닐 수
#    있음(예: 통산 타자 — 타수; 타율이 더 적절할 수 있음) — 참고용이라 무해하나 검수 시 확인.
# 갱신: 시즌 종료 후 1회 + 마일스톤 이벤트 시 수동.
#
# ⚠️ 2026-09-30: `retired`·`currentTeam` 필드 신설(RECORD_OX(perTeam) 병목 대응).
#    예전엔 routine이 매 실행마다 "이 선수가 이 팀 소속인지" 위키를 뒤져 재확인했는데,
#    이 카테고리 대부분이 1980~90년대 은퇴 레전드라 매번 허탕이었다(scoring.yaml
#    "perTeam 신설" 첫 실행 관찰 — 9개 팀 중 8개가 RECORD_OX 0건). 아래는 그 확인을
#    한 번 미리 해 둔 것이다 — `wiki/players/*.md`의 실제 현재 로스터와 이름을
#    대조했다(추측 아님). `retired: true`면 `currentTeam`은 항상 null이고, RECORD_OX는
#    `retired: false`인 항목만 팀별로 바인딩한다.
#    ⚠️ 이름만으로 매칭했으므로 동명이인 위험이 있다 — 예를 들어 history-player-hitter
#    10위 "이정훈"은 위키에 KT 소속 동명이인이 있지만, 이 카테고리 자체가 전부 1980년대
#    데이터라(다른 9명 전원이 그 시대 은퇴 레전드) 실제로는 그 시절 선수(대부분 은퇴)를
#    가리키는 것으로 보고 currentTeam을 채우지 않았다 — 시대가 안 맞는 매칭은 채택하지
#    않는 것이 오답 유출보다 안전하다. `최형우`→SS·`서건창`→WO 두 건만 연대·이름 둘 다
#    현재 로스터와 부합해 채택했다. 이 판단 자체도 사람 검수 대상이다(맨 위 "v0 초안" 참고).
#    ⚠️ 이 enrichment로도 RECORD_OX 재료는 근본적으로 크게 늘지 않는다 — 이 파일 자체가
#    30개 항목뿐이고 대부분 현역과 무관한 시대라서다. 팀당 매일 RECORD_OX를 안정적으로
#    공급하려면 이 파일에 현역 중심 항목(최근 시즌 기록 등)을 사람이 추가로 채워 넣는
#    별도 작업이 필요하다(이번 변경 범위 밖).
