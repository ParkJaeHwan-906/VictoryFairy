# 퀴즈 보상(포인트·BQ)·출제 비율 정본 (single source of truth)
#
# 값을 바꾸면 다음 실행부터 자동으로 반영된다. 이 파일 밖 어디에도 숫자를 다시
# 적지 않는다 — 소비처는 전부 여기를 읽는다:
#   - question-gen/scripts/validate_candidates.py  (업로드 직전 결정적 게이트)
#   - runner/runner/finalize.py                    (최종 선별·포인트 부여)
#   - question-gen/prompts/generation-rules.md §5  (표 대신 이 파일을 참조)
#   - question-gen/ROUTINE.md ③⑥단계               (생성·선별 물량)
#
# ⚠️ 소급 적용 안 됨 — pointReward·bqReward는 발행 시점 값이 quiz-candidates
#    JSON에 기록되어 RDB로 넘어간다. 표를 고치면 그 이후 발행분부터 바뀌고, 이미
#    나간 문항은 옛 값을 유지한다. 과거분까지 바꾸려면 BE가 difficulty
#    기준으로 재계산해야 한다(아래 '운영 메모' 참조).

# version은 **발행분에 박히는 보상 값의 세대**를 가리킨다. 2026-08-12 volume
# 조정 때 version을 유지한 것은 그 변경이 보상 필드를 하나도 건드리지 않아서다
# (물량만 바뀌었고 문항에 기록되는 값은 그대로). 2026-09-03 bq 표 신설은 그
# 선례가 아니라 반대쪽이라(후보 JSON에 bqReward 필드가 새로 실리고 소비처가
# 새 키를 읽어야 함) 2로 올렸다. 2026-09-29 perTeam 신설은 다시 물량만 바꾸는
# 변경이라(보상 필드 추가 없음) version을 유지한다.
version: 2
updatedAt: 2026-09-29   # perTeam 신설(보상 값 자체는 무변경이라 version 유지)

# ── 난이도별 획득 점수 ──────────────────────────────────
# 난이도 정의(기능명세서): EASY = 단순 승패·기본 사실 확인 / MEDIUM = 최근 경기·
# 시즌 통계 비교 / HARD = 추세·순위 변동 등 계산이 필요한 사실 / EXPERT = 역대
# 기록·마니아급 지식.
points:
  EASY: 30
  MEDIUM: 50
  HARD: 80
  EXPERT: 120

# ── 난이도별 획득 BQ ────────────────────────────────────
# points와 나란히 가는 두 번째 보상 축이다(후보 JSON의 `bqReward`). 난이도 라벨은
# points와 **같은 집합**이어야 한다 — 소비처(validate_candidates.py·finalize.py)가
# 두 표의 키가 같다고 보고 difficulty 하나로 둘 다 조회하므로, 한쪽에만 난이도를
# 추가하면 로드 시점에 fail-closed로 죽는다.
#
# 값이 1~4의 작은 정수인 것은 points(30~120)와 성격이 다르기 때문이다 — points는
# 문항마다 쌓이는 점수라 난이도 차이를 크게 벌려도 되지만, bq는 눈금이 몇 칸 안 되는
# 축이라 난이도 순서만 유지하면 된다.
#
# ⚠️ **5는 예약값이다 — 지금은 어떤 난이도에도 부여하지 않는다.** 현재 난이도 라벨은
#    EASY~EXPERT 4개뿐이라 4까지만 쓰고, 5는 EXPERT 위 상위 난이도가 생겼을 때 쓸
#    자리로 비워 둔다. 지금 EXPERT를 5로 당겨 두면 그때 기존 EXPERT 발행분과 새
#    난이도가 같은 값을 갖거나 표 전체를 밀어야 해서(=소급 재계산 필요) 곤란해진다.
#    난이도 라벨을 늘리는 것 자체는 이 파일만으로 안 된다(맨 아래 '운영 메모' 참조).
bq:
  EASY: 1
  MEDIUM: 2
  HARD: 3
  EXPERT: 4

# ── 출제 물량 ───────────────────────────────────────────
# 난이도별 최종 채택 문항 수. 검증 패스 5단계(최종 선별)에서 슬롯으로 쓴다 —
# 통과분이 모자라면 있는 만큼만, 남으면 재미 점수 내림차순으로 채운다.
#
# perGame은 **경기 하나당**, common은 **하루 전체**에 적용된다. 오늘 5경기면
# 하루 총량은 perGame 합계 × 5 + common 합계 = 20×5 + 22 = 122문항.
#
# ⚠️ perGame은 **구단별 문항 수와 같다 — 양 팀이 나눠 갖지 않는다.** 귀속 축
#    (top-level teamCodes = "어느 팀 팬에게 보여줄지")에 그 경기 양 팀이 모두
#    들어가므로, 12문항 묶음은 양 팀 각각에게 12문항이다. KBO 10개 구단은 매일
#    정확히 1경기씩 뛰므로 **구단별 문항 수 = perGame 합계**가 그대로 성립한다.
#    (실측 2026-08-11 발행분: 경기 묶음 10~12 → 팀별 귀속도 10~12로 동일)
#
# 2026-08-12 조정(12 → 20). 목표는 **사용자 1인이 하루 20문항 이상**을 받는 것.
# 팬이 선호구단을 고르므로 1인 체감 = (자기 팀 경기 문항) + (공통 문항)이다.
# 실측에서 4일 중 1일만 20을 넘었다:
#
#   날짜    경기문항/팀   공통   1인 체감
#   08-09      0          15      15     ← 전 경기 폭염취소
#   08-10      0          12      12     ← 월요일
#   08-11    10~12        11    21~23    ← 유일한 달성
#   08-12     8~10         6    14~16
#
# ── 난이도 배분은 실측 병목을 따른다 ──
# **어느 난이도가 슬롯에서 잘렸는지**를 발행분에서 직접 읽어 그 자리만 넓혔다.
# perGame과 common의 병목이 정반대라 두 블록의 배분이 다르다.
#
# 경기 묶음(10개 관측) — MEDIUM만 잘리고 나머지는 미달:
#   난이도   구 슬롯   실제 충족
#   EASY       4       1~4      여유
#   MEDIUM     5       5,5,5,5,5  ← 10개 전부 슬롯값. 여기가 병목
#   HARD       2       1~2      여유
#   EXPERT     1       0~1      여유
#
# 공통 묶음(4일 관측) — 반대로 MEDIUM만 여유고 나머지 셋이 잘림:
#   난이도   구 슬롯   실측 최대
#   EASY       6         6      ← 잘림
#   MEDIUM     8         5        여유
#   HARD       4         4      ← 잘림
#   EXPERT     2         2      ← 잘림
#
# 그래서 명세의 일일 비율 30/40/20/10을 그대로 쓰지 않는다. 두 블록 모두
# **어떤 날의 실측 발행량도 줄지 않는 것**을 조건으로 값을 정했다(신 슬롯을
# 실측 분포에 상한으로 씌워 확인 — 4일 × 두 블록 전부 감소 0).
#
# ⚠️ 여기서 "잘렸다"는 것은 최종 채택 단계의 상한이라는 뜻이고, 폐기된 후보
#    풀이 남아 있지 않아 **인과는 간접 증거**다(경기 묶음 10개가 분산 0으로
#    정확히 5라는 관측이 근거). 후보 풀을 남기면 직접 확인할 수 있다.
#
# ── 점수 총량은 늘어난다 (의도된 결과) ──
# 물량을 늘렸으니 1인이 하루에 얻을 수 있는 점수도 함께 오른다. 밸런스 중립이
# 아니므로 랭킹을 보는 쪽은 이 변화를 알고 있어야 한다:
#   구: perGame E4M5H2X1 = 650 + common E6M8H4X2 = 1140  →  1790
#   신: perGame E4M10H5X1 = 1140 + common E8M6H6X2 = 1260  →  2400  (+34%)
# 이미 발행된 문항의 pointReward는 그대로다(머리 주석의 소급 미적용 규칙).
#
# ── 2026-09-29: perTeam 신설 — 목표를 1인 100~150문항/일로 상향 ──
# 그동안 목표는 "1인 20문항 이상"이었고 실측은 그보다도 낮았다(12~23). 요구사항이
# 팀당 최소 100~150문항/일로 올라갔는데, `perGame`(경기당, 하루 1경기라 팀당
# 상한 있음)·`common`(리그 공통, 팀 색깔 없음) 두 축만으로는 이 물량에 못 미친다
# — perGame+common 합계는 구조적으로 42가 상한이다(그나마 실측은 그 절반 수준).
#
# 그래서 셋째 축 `perTeam`(팀마다 매일 발행 — 그 팀 경기 유무와 무관)을 신설한다.
# 재료는 PLAYER/TEAM scope 템플릿(`CAREER_PATH`·`MEME_ORIGIN`·`RECORD_OX`·
# `STREAK_CURRENT`·`HOME_AWAY_SPLIT`·`RECENT_VS_EARLY` 등)이고, 이건 그날 경기가
# 아니라 그 팀 위키 로스터(팀당 63~89명, 아래 "재료 상한" 참고)에서 나오므로
# perGame과 달리 경기 여부에 매이지 않는다. `question-gen/ROUTINE.md` §3의 "경기가
# 없는 날" 절차(같은 템플릿을 그날의 보충용으로만 쓰던 것)를 **매일 기본으로
# 돌리는 것**으로 승격한 것이 이 블록이다 — 더는 "보충"이 아니라 "기본 할당".
#
# 1인 체감 목표: perGame(20, 경기 있는 날만) + common(22) + perTeam(90) =
#   경기 있는 날 132 / 경기 없는 날 112 — 둘 다 100~150 범위 안.
#
# ⚠️ EXPERT는 perTeam에서도 여전히 재료가 얇다 — 유일한 EXPERT 템플릿
#    `RELATION_LINK`는 팀별 안전 관계 엣지가 실측 1~12건뿐이라(아래 참고),
#    perTeam의 EXPERT 슬롯(6)은 대개 못 채우고 넘어간다 — 슬롯은 상한일 뿐
#    보장이 아니므로(select_final "있는 만큼만") 정상 동작이다. 억지로 채우려고
#    금지 소재(사건연루)를 쓰거나 사실을 지어내면 안 된다.
#
# ⚠️ **이 신설은 값만 바꾼 것이 아니다** — `runner/runner/finalize.py`의
#    `select_final`도 함께 고쳤다(가만히 두면 `perTeam` 슬롯이 그냥 무시되고
#    전부 `common` 취급된다). 후보의 `gameId is None` 그룹을 이제 `teamCodes`로
#    한 번 더 쪼갠다 — `teamCodes`가 비어 있으면 여전히 `common`(팀 색깔 없는
#    공통 문항), `teamCodes`에 팀이 있으면 그 팀의 `perTeam` 슬롯을 그 팀에게만
#    적용한다. 이 파일에 항목을 더 추가할 때 `finalize.py`가 그 항목을 실제로
#    읽는지 항상 같이 확인할 것 — 정본은 YAML이지만 소비 코드가 없으면 죽은 값이다.
#
# ⚠️ **실행 방식은 그대로다** — 여전히 하루 1회·단일 세션이 문항을 하나씩
#    수작업으로 작성한다(요청에 따라 이번 변경 범위는 설정값만이고 실행 방식은
#    손대지 않았다). 다만 예전에 ROUTINE.md에 적혀 있던 "60분 상한"은 그와 함께
#    풀었다(2026-09-29) — 실제 등록된 routine 프롬프트엔 애초에 그 숫자가 없었고,
#    최근 10회 실행이 전부 20~40분에 끝나 60분 근처에도 간 적이 없어서, 그 숫자가
#    실측 병목이 아니라 옛 저물량 기준으로 그은 여유선이었을 뿐임이 드러났다.
#    perTeam 도입으로 하루 총 생성 필요량이 크게 늘었으므로(팀당 90슬롯 ×
#    candidateMultiplier × 10개 팀) 실행 시간 자체는 훨씬 길어질 것이다 — 그건
#    정상이다. 다만 클라우드 routine 세션에 내가 확인 못 한 플랫폼 자체의 한도가
#    있을 수 있다 — 있다면 "경기 단위 fail-closed" 원칙(경기 → 팀 특화 → 공통
#    순서)이 그 시점까지 만든 것만 남기고 나머지는 그냥 생략한다(다음 실행이
#    보충하지 않음, 신선도 우선 원칙 유지). 다음 며칠 실행의 실제 소요 시간·완주
#    여부를 관찰해서, 여전히 목표에 못 미치면 그때 실행 방식(병렬화 등)을
#    다시 논의해야 한다.
#
# ── 재료 상한 ──
# 위키 등재 선수 **715명**(팀당 63~89명 — 2026-08-12 실측). PLAYER scope 템플릿
# (CAREER_PATH·MEME_ORIGIN·RECORD_OX)은 선수 수만큼 확장되므로 경기당 20은 재료
# 문제가 아니다. 구 주석의 "위키 10명 기준 경기당 19~25"는 위키가 10명이던
# 2026-08-05 측정치라 폐기했다.
#
# ⚠️ EXPERT만 재료가 실제로 얇다 — 유일한 EXPERT 템플릿 RELATION_LINK가
#    `needs: [graph, wiki]`인데 관계 엣지가 **47건**(커리어교차 23·밈공유 15·
#    사건연루 7·라이벌 2, 무방향 30쌍)뿐이다. graph.json 실측이며 팀별로는
#    OB 12 · SK 7 · HH 7 … KT 1로 편차가 크다. 경기 묶음에서 EXPERT를 1로 둔
#    것은 실측 충족이 0~1이어서고, 엣지가 쌓이면 올릴 자리다.
#
# ⚠️ 경기가 없는 날은 perGame이 무의미하다(구단별 0문항) — 월요일, 전 경기
#    취소일. 공통 문항만 남으므로 그날 1인 체감은 common 합계가 전부다.
#    ROUTINE ③단계가 그런 날 공통 묶음에 PLAYER/TEAM 템플릿을 투입해 채운다.
#    다만 common 슬롯을 올려도 그날 20을 채운다는 보장은 없다 — 실측 12~15에서
#    출발하므로 한 사이클 관측 후 candidateMultiplier까지 손봐야 할 수 있다.
volume:
  perGame:            # 경기 문항 — gameId·teamCodes가 붙는 문항, 경기 하나당
    EASY: 4           # = 그 경기 양 팀 각각의 구단별 문항 수 (나눠 갖지 않는다)
    MEDIUM: 10        # 관측 병목 — 10개 묶음 전부 구 슬롯 5에서 잘렸다
    HARD: 5
    EXPERT: 1         # 실측 충족 0~1. RELATION_LINK 엣지가 쌓이면 상향
  common:             # 공통 문항 — gameId 없고 teamCodes도 빈 문항, 하루 전체
    EASY: 8           # 관측 병목(실측 최대 6 = 구 슬롯 6)
    MEDIUM: 6         # 실측 최대 5로 구 슬롯 8에 못 미쳤다 — 올려도 효과 없음
    HARD: 6           # 관측 병목(실측 최대 4 = 구 슬롯 4)
    EXPERT: 2         # 관측 병목(08-09에 2개 채움). 낮추면 그날 문항이 사라진다
  perTeam:            # 팀 특화 문항 — gameId 없고 teamCodes에 그 팀 하나만 있는
                       # 문항. 팀마다 매일 이 슬롯 그대로 적용(2026-09-29 신설,
                       # 위 "perTeam 신설" 절 참고). PLAYER/TEAM scope 템플릿이
                       # 재료 — 그 팀 위키 로스터 기준이라 경기 유무와 무관하다.
                       #
                       # 2026-09-30 재배분(첫 실행 실측 근거) — 원래 EASY24/MEDIUM38/
                       # HARD22/EXPERT6이었는데 첫 실행에서 MEDIUM이 거의 전 팀
                       # 0~1건으로 무너졌다(RECORD_OX·HOME_AWAY_SPLIT 둘 다 재료가
                       # 얇음 — RECORD_OX는 all-time-records.yaml에 `retired`/
                       # `currentTeam` 필드를 추가했지만 그 파일 자체가 30개뿐이라
                       # 근본 해결은 아니다). 대신 CAREER_PATH(HARD)·MEME_ORIGIN(EASY)는
                       # 로스터 규모만큼 확장돼 목표에 근접했다(예: 키움 EASY 24/24,
                       # HARD 22/22 — 구단마다 편차는 있음). MEDIUM 몫을 크게 줄이고
                       # HARD로 옮긴다 — RECENT_VS_EARLY도 이동창으로 바꿔(위
                       # question-templates.yaml) HARD 쪽 재료가 조금은 늘 것으로
                       # 기대하지만, 실측 전까지는 CAREER_PATH가 그 자리를 채운다고
                       # 보수적으로 가정한다.
    EASY: 30
    MEDIUM: 10        # RECORD_OX·HOME_AWAY_SPLIT 재료 소진 — 대개 0~2건, 정상.
    HARD: 44
    EXPERT: 6         # RELATION_LINK 재료가 얇아 대개 미달로 끝난다 — 정상.
  # 생성 단계에서 만들 후보 배수(검증 폐기율 흡수). 20문항 슬롯이면 30개 생성.
  # 관측 생존율: 경기 문항 50~62%, 공통 20~37%. perTeam은 관측치 없음(신설) —
  # 첫 실행 결과로 재조정할 것.
  candidateMultiplier: 1.5

