# 퀴즈 점수·출제 비율 정본 (single source of truth)
#
# 값을 바꾸면 다음 실행부터 자동으로 반영된다. 이 파일 밖 어디에도 숫자를 다시
# 적지 않는다 — 소비처는 전부 여기를 읽는다:
#   - question-gen/scripts/validate_candidates.py  (업로드 직전 결정적 게이트)
#   - runner/runner/finalize.py                    (최종 선별·포인트 부여)
#   - question-gen/prompts/generation-rules.md §5  (표 대신 이 파일을 참조)
#
# ⚠️ 소급 적용 안 됨 — pointReward는 발행 시점 값이 quiz-candidates JSON에
#    기록되어 RDB로 넘어간다. 표를 고치면 그 이후 발행분부터 바뀌고, 이미
#    나간 문항은 옛 점수를 유지한다. 과거분까지 바꾸려면 BE가 difficulty
#    기준으로 재계산해야 한다(아래 '운영 메모' 참조).

version: 1
updatedAt: 2026-08-05

# ── 난이도별 획득 점수 ──────────────────────────────────
# 난이도 정의(기능명세서): EASY = 단순 승패·기본 사실 확인 / MEDIUM = 최근 경기·
# 시즌 통계 비교 / HARD = 추세·순위 변동 등 계산이 필요한 사실 / EXPERT = 역대
# 기록·마니아급 지식.
points:
  EASY: 30
  MEDIUM: 50
  HARD: 80
  EXPERT: 120

# ── 일일 최종 출제 비율 ─────────────────────────────────
# 목표 10문항 기준 난이도별 문항 수. 검증 패스 5단계(최종 선별)에서 쓴다.
# 통과분이 모자라면 있는 만큼만, 남으면 재미 점수 내림차순으로 채운다.
dailyRatio:
  EASY: 3
  MEDIUM: 4
  HARD: 2
  EXPERT: 1

# ── 운영 메모 ───────────────────────────────────────────
# 점수 체계를 바꾸는 절차:
#   1. 이 파일의 points 값을 고치고 version을 올린다.
#   2. 다음 생성 실행부터 새 값이 적용된다(코드 수정 불필요).
#   3. 이미 발행된 문항까지 바꾸려면 BE에서 quiz 테이블을 difficulty 기준으로
#      UPDATE 한다. 단 사용자가 이미 획득한 점수는 답변 레코드에 스냅샷으로
#      남아 있어야 랭킹이 흔들리지 않는다(BE 합의 필요 사항).
#
# 난이도 라벨 자체를 늘리거나 줄이는 건 이 파일만으로 안 된다 — 카탈로그
# (question-templates.yaml)의 difficulty 값, BE enum, 검증 게이트가 함께 움직여야
# 한다. 점수 '값'만 바꾸는 것이 이 파일의 범위다.
