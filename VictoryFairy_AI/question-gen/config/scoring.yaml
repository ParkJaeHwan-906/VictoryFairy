#   2. 다음 생성 실행부터 새 값이 적용된다(코드 수정 불필요).
#   3. 이미 발행된 문항까지 바꾸려면 BE에서 quiz 테이블을 difficulty 기준으로
#      UPDATE 한다(point·bq 두 컬럼 모두). 단 사용자가 이미 획득한 값은 답변
#      레코드에 스냅샷으로 남아 있어야 랭킹이 흔들리지 않는다(BE 합의 필요 사항).
